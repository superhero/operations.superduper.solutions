# Temporary workaround for stale GitHub App inputs in actionlint 1.7.12:
# https://github.com/rhysd/actionlint/issues/648
# Remove this file when the pinned actionlint release includes the upstream fix.
paths:
  .github/workflows/ci-{main,develop,release,support}.yml:
    ignore:
      - '^missing input "app-id" which is required by action "actions/create-github-app-token@v3"\.'
      - '^input "client-id" is not defined in action "actions/create-github-app-token@v3"\.'
