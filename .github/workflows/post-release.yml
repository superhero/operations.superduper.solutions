name: Post-release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  context:
    name: Resolve release context
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.release.outputs.applicable }}
      pr_number: ${{ steps.release.outputs.pr_number }}
      head_ref: ${{ steps.release.outputs.head_ref }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}

    steps:
      - name: Resolve merged release or hotfix PR
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr="$(
            gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" |
              jq -c '[
                .[] |
                select(
                  .base.ref == "main" and
                  (
                    (.head.ref | startswith("release/")) or
                    (.head.ref | startswith("hotfix/"))
                  )
                )
              ][0] // empty'
          )"

          if [[ -z "$pr" ]]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "No merged release/* or hotfix/* PR is associated with $MERGE_SHA; post-release work is not applicable."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"

          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          echo "Resolved PR #$pr_number ($head_ref @ ${head_sha:0:7}) merged as ${MERGE_SHA:0:7}."

  tag:
    name: Create release tag
    needs: context
    if: needs.context.outputs.applicable == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.merge_sha }}
          fetch-depth: 0

      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ needs.context.outputs.head_ref }}
          MERGE_SHA: ${{ needs.context.outputs.merge_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            release/*)
              kind="release"
              version="${HEAD_BRANCH#release/}"
              ;;
            hotfix/*)
              kind="hotfix"
              version="${HEAD_BRANCH#hotfix/}"
              ;;
            *)
              echo "::error::Unsupported source branch '$HEAD_BRANCH'."
              exit 1
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver_re ]] || {
            echo "::error::$kind version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."
            exit 1
          }

          git fetch --quiet --tags --force

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Tag '$version' already exists on a different commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version"
          git push origin "refs/tags/$version"

  deploy:
    name: Deploy validated bundle
    needs: context
    if: needs.context.outputs.applicable == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve validated CI run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
        run: |
          set -euo pipefail

          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow ci.yml \
              --event pull_request \
              --commit "$HEAD_SHA" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          [[ -n "$run_id" ]] || {
            echo "::error::No successful release CI run found for PR #$PR_NUMBER at $HEAD_SHA."
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name bundle \
            --dir dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy validated bundle to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.context.outputs.merge_sha }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          set -euo pipefail

          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$MERGE_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          SOURCE_BRANCH: ${{ needs.context.outputs.head_ref }}
          SOURCE_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          {
            echo "**Preview URL:** $DEPLOYMENT_URL"
            echo
            echo "**Promoted artifact:** CI run #$SOURCE_RUN_ID"
            echo
            echo "**Source:** PR #$PR_NUMBER ($SOURCE_BRANCH @ ${SOURCE_SHA:0:7})"
          } >> "$GITHUB_STEP_SUMMARY"

  backmerge:
    name: Back-merge main into develop
    needs: context
    if: needs.context.outputs.applicable == 'true'
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Synchronize main into develop without a CI gate
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          develop_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/develop" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$develop_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the branch commits."
            exit 1
          }

          behind_by="$(gh api "repos/$REPOSITORY/compare/$main_sha...$develop_sha" --jq '.behind_by')"
          [[ "$behind_by" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine whether synchronization is needed."
            exit 1
          }
          if [[ "$behind_by" == "0" ]]; then
            echo "develop already contains main; no synchronization is needed."
            exit 0
          fi

          # Use the workflow token, not the App token: no automatic PR CI or push CI.
          pr_number="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f base=develop -f "head=${REPOSITORY%%/*}:main" \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(
              gh api --method POST "repos/$REPOSITORY/pulls" \
                -f base=develop -f head=main \
                -f title="Back-merge main into develop" \
                -f body="Automatic Gitflow synchronization. Development checks run after the merge and do not gate synchronization." \
                --jq '.number'
            )"
          fi
          [[ "$pr_number" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not resolve the synchronization PR."
            exit 1
          }

          # Satisfy only the actual topology rule, never manufacture test results.
          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$REPOSITORY" --arg sha "$main_sha" '
            .state == "open" and .draft == false and
            .base.ref == "develop" and .head.ref == "main" and
            .base.repo.full_name == $repo and .head.repo.full_name == $repo and
            .head.sha == $sha
          ' <<<"$pr" >/dev/null || {
            echo "::error::PR topology or main head changed; refusing to merge."
            exit 1
          }

          gh api --method POST "repos/$REPOSITORY/statuses/$main_sha" \
            -f state=success -f context="Gitflow topology" \
            -f description="Validated same-repository main -> develop synchronization" \
            -f "target_url=$RUN_URL" >/dev/null

          # GitHub still enforces branch rules and rejects conflicts or a changed head.
          result="$(
            gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" \
              -f merge_method=merge -f "sha=$main_sha"
          )"
          jq -e '.merged == true' <<<"$result" >/dev/null || {
            echo "::error::GitHub did not merge the synchronization PR."
            exit 1
          }
          merge_sha="$(jq -r '.sha' <<<"$result")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub returned an invalid merge commit."
            exit 1
          }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Start development health checks after synchronization
        id: health
        if: steps.sync.outputs.merged == 'true'
        continue-on-error: true
        shell: bash
        env:
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          set -euo pipefail
          # Explicit dispatch is needed because GITHUB_TOKEN suppresses push workflows.
          # Check the resulting develop commit, not the pre-merge main commit.
          jq -n --arg sha "$MERGE_SHA" '{ref: "develop", inputs: {commit_sha: $sha}}' |
            gh api --method POST "repos/$REPOSITORY/actions/workflows/develop.yml/dispatches" --input -

      - name: Synchronization summary
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MERGED: ${{ steps.sync.outputs.merged }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          if [[ "$MERGED" == "true" ]]; then
            echo "Merged main into develop through PR #$PR_NUMBER at $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$HEALTH_OUTCOME" == "success" ]]; then
              echo "Development health checks requested after the merge; their result does not gate synchronization." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Synchronization succeeded, but development health checks could not be started."
              echo "Development health checks could not be started; synchronization remains complete." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$SYNC_OUTCOME" == "success" ]]; then
            echo "develop already contains main; no back-merge was needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Synchronization did not complete; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
