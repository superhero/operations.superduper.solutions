name: workflow-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows and embedded scripts
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Lint standalone scripts
        run: shellcheck .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test automation
        id: automation
        run: npm --loglevel=error run test:automation

      - name: Upload automation report
        if: success() || (failure() && steps.automation.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-report
          path: tmp/test/cucumber-automation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
