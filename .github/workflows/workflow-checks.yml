name: workflow-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release Automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows and embedded scripts
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Lint standalone scripts
        run: shellcheck .github/scripts/*.sh

      - name: Test release automation without GitHub mutations
        run: python3 -B -m unittest discover -s .github/tests -v
