name: Dev Validation

on:
  push:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type Check
        run: npx --no-install tsc --project tsconfig.json --noEmit

      - name: Source tests and coverage
        run: |
          mkdir -p tmp/test
          npm --silent run coverage

      - name: Bundle
        run: npx --no-install vite build

      - name: Acceptance tests
        run: npm --silent test
