name: ci-branches
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [develop, 'release/**', 'support/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: branches-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Workflow Checks
    uses: ./.github/workflows/workflow-checks.yml

  validate-pr:
    name: Validate Gitflow
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr.sh "$REPOSITORY" "$HEAD_BRANCH" "$BASE_BRANCH" "$HEAD_SHA"

  application:
    name: Test and Build
    needs: validate-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm --loglevel=error run typecheck

      - name: Source tests
        run: npm --loglevel=error run test:source

      - name: Build
        run: npm --loglevel=error run build

      - name: Acceptance tests
        id: acceptance
        run: npm --loglevel=error run test:acceptance

      - name: Upload failed acceptance report
        if: failure() && steps.acceptance.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  auto-merge:
    name: Auto Merge
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [workflow-checks, validate-pr, application]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout validated merge
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA"
