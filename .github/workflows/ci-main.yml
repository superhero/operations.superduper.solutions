name: ci-main
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, ready_for_review ]

concurrency:
  group: integration-ci
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Prepare queued integration
    if: "!startsWith(github.head_ref, 'docs/')"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/prepare-integration.yml
    with:
      mode: head
      workflow-file: .github/workflows/ci-main.yml
    secrets:
      app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  release-route:
    needs: integration
    name: Classify Release Update
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    permissions:
      contents: read
    outputs:
      run_release: ${{ steps.classify.outputs.run_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted event base automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned release update objects
        if: github.event.action == 'synchronize' && startsWith(github.head_ref, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! -e .github/scripts/classify-release-update.sh || ! -e .github/scripts/check-release-changelog-update.mjs || ! -e .github/scripts/changelog.mjs ]]; then
            echo 'Trusted base predates release routing; no incremental comparison is needed.'
            exit 0
          fi
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Full previous and current release head SHAs are required.' >&2
            exit 1
          }
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$authorization"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            git fetch --no-tags origin "$BEFORE_SHA" "$HEAD_SHA"
      - name: Classify release update
        id: classify
        env:
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Bootstrap the first promotion of this workflow while main still
          # predates its helper. Keep the legacy full pipeline in that case.
          if [[ ! -e .github/scripts/classify-release-update.sh || ! -e .github/scripts/check-release-changelog-update.mjs || ! -e .github/scripts/changelog.mjs ]]; then
            echo 'run_release=true' >> "$GITHUB_OUTPUT"
            echo 'Trusted base predates release routing; run the full pipeline.'
            exit 0
          fi
          bash .github/scripts/classify-release-update.sh "$EVENT_ACTION" "$HEAD_BRANCH" "$BEFORE_SHA" "$HEAD_SHA"

  validation:
    name: Find Previous Validation
    needs: [ integration, release-route ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      needs.release-route.outputs.run_release == 'true'
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.find.outputs.reused }}
      source_run_id: ${{ steps.find.outputs.source_run_id }}
      source_run_attempt: ${{ steps.find.outputs.source_run_attempt }}
      source_sha: ${{ steps.find.outputs.source_sha }}
      tested_sha: ${{ steps.find.outputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Find complete matching validation
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/find-validation.mjs "$REPOSITORY" "$TARGET_SHA" tmp/reused-validation
      - name: Retain verified artifacts for this run
        if: steps.find.outputs.reused == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reused-validation
          path: tmp/reused-validation
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  workflow-checks:
    name: Automation Checks
    needs: [ integration, release-route, validation ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      needs.release-route.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: needs.validation.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Lint standalone scripts
        if: needs.validation.outputs.reused != 'true'
        run: shellcheck .github/scripts/*.sh
      - name: Set up Node.js
        if: needs.validation.outputs.reused != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Check dependency version badges
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run badges:dependencies -- --check
      - name: Test automation
        if: needs.validation.outputs.reused != 'true' && github.head_ref != 'develop'
        id: automation
        run: npm --loglevel=error run test:automation
      - name: Upload automation report
        if: ${{ !cancelled() && (steps.automation.outcome == 'success' || steps.automation.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-report
          path: |-
            tmp/test/vitest-automation.json
            tmp/test/blobs/automation.json
            tmp/test/executions/automation.json
            tmp/test/attachments
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Reuse successful automation validation
        if: needs.validation.outputs.reused == 'true'
        env:
          SOURCE_RUN_ID: ${{ needs.validation.outputs.source_run_id }}
        run: echo "Automation already passed in validated run $SOURCE_RUN_ID."

  validate-pr:
    name: Validate Gitflow
    needs: [ integration, release-route ]
    permissions:
      contents: read
      pull-requests: read
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      needs.release-route.outputs.run_release == 'true' && (github.head_ref != 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate release pull request or retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ needs.integration.outputs.base_sha }}
        run: bash .github/scripts/validate-release-pr.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_BRANCH" "$HEAD_SHA" "$BASE_SHA"

  create-release:
    name: Create Release
    needs: [ integration, workflow-checks ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') && github.head_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    concurrency:
      group: release-creation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/create-release-pr.sh "$REPOSITORY" "$SOURCE_PR" "$SOURCE_SHA"

  release-changelog:
    name: Prepare Release Changelog
    needs: [ integration, workflow-checks, validate-pr ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') && github.head_ref != 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    concurrency:
      group: release-changelog-${{ github.head_ref }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Create GitHub App token
        if: startsWith(github.head_ref, 'release/') && needs.integration.outputs.recovery != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open release changelog documentation PR
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECOVER_MERGED: ${{ needs.integration.outputs.recovery }}
        run: |
          if [[ "$RECOVER_MERGED" == true && "$HEAD_BRANCH" == release/* ]]; then
            # validate-pr already confirmed this exact merged release tree.
            # Recovery may follow branch deletion: inspect its pinned changelog
            # without creating another docs PR or obtaining write credentials.
            node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { releaseChangelog } from './.github/scripts/changelog.mjs';
          const entry = execFileSync('git', ['ls-tree', process.env.HEAD_SHA, '--', 'CHANGELOG.md'], { encoding: 'utf8' });
          if (!/^100644 blob [0-9a-f]{40}\tCHANGELOG\.md\n$/.test(entry)) throw new Error('Release recovery requires a regular versioned changelog.');
          const document = execFileSync('git', ['show', `${process.env.HEAD_SHA}:CHANGELOG.md`], { encoding: 'utf8' });
          if (releaseChangelog(document, process.env.HEAD_BRANCH.slice('release/'.length)) !== document)
            throw new Error('The merged release changelog is not versioned; recovery cannot change published content.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          JS
          elif [[ "$HEAD_BRANCH" == release/* ]]; then
            bash .github/scripts/create-release-changelog-pr.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_BRANCH" "$HEAD_SHA"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
  validation-prepare:
    name: Prepare validation and quick gates
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
      - release-changelog
    if: (needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') && github.head_ref != 'develop'
      && needs.release-changelog.outputs.ready == 'true') && (needs.validation.outputs.reused != 'true' &&
      vars.CI_INCREMENTAL_TESTS != 'false')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Type check
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run typecheck
      - name: Source tests with coverage
        if: needs.validation.outputs.reused != 'true'
        id: source
        run: npm --loglevel=error run test:source:coverage
      - name: Gherkin runner integration contracts
        id: runner
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run test:runner
      - name: Check coverage thresholds
        if: needs.validation.outputs.reused != 'true'
        id: coverage
        run: >
          npm --loglevel=error run test:coverage

          jq -r '.total | "Coverage: statements \(.statements.pct)%, branches \(.branches.pct)%, functions
          \(.functions.pct)%, lines \(.lines.pct)%."' \
            tmp/test/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run build
      - name: Acceptance tests
        if: needs.validation.outputs.reused != 'true'
        id: acceptance
        run: npm --loglevel=error run test:acceptance
      - name: Component tests
        id: components
        env:
          OPERATIONS_BROWSER_PROFILE: components
        run: npm --loglevel=error run test:browser
      - name: Prepare immutable browser inputs
        env:
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/ci-prepare.mjs
      - name: Verify reusable feature evidence before scheduling
        id: cache
        uses: ./.github/actions/ci-browser
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: prepare
          node: node
      - name: Upload prepared browser inputs
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-inputs
          path: |-
            dist
            tmp/test/ci/plan.json
            tmp/test/browser/fixture-bundles.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Retain quick-profile evidence
        if: "!cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure')"
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-test-report
          path: |-
            tmp/test/vitest-*.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
            tmp/test/coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Retain verified reused units
        if: steps.cache.outputs.has_reused == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-reused-units
          path: tmp/test/units
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    outputs:
      matrix: ${{ steps.cache.outputs.matrix }}
      has_work: ${{ steps.cache.outputs.has_work }}
      has_reused: ${{ steps.cache.outputs.has_reused }}
  browser-validation:
    name: Browser validation (${{ matrix.batch }})
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
      - release-changelog
      - validation-prepare
    if: ((needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') && github.head_ref != 'develop'
      && needs.release-changelog.outputs.ready == 'true') && (needs.validation.outputs.reused != 'true' &&
      vars.CI_INCREMENTAL_TESTS != 'false')) && needs.validation-prepare.outputs.has_work == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validation-prepare.outputs.matrix || '{"batch":["none"]}') }}
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Locate pinned Node
        id: node
        run: printf 'path=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_OUTPUT"
      - name: Download prepared browser inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-browser-inputs --dir .
      - name: Run outstanding features and publish checkpoints
        uses: ./.github/actions/ci-browser
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_FILE: .github/workflows/ci-main.yml
        with:
          mode: batch
          batch: ${{ matrix.batch }}
          node: ${{ steps.node.outputs.path }}
      - name: Retain browser batch metrics
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-metrics-${{ matrix.batch }}-attempt-${{ github.run_attempt }}
          path: tmp/test/ci/batch-*.json
          if-no-files-found: warn
          retention-days: 7

  application:
    name: Test and Build Release
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
      - release-changelog
      - validation-prepare
      - browser-validation
    if: (!cancelled()) && (needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      github.head_ref != 'develop' && needs.release-changelog.outputs.ready == 'true')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Require successful preparation and quick gates
        env:
          STATIC_RESULT: ${{ needs.workflow-checks.result }}
          PREPARE_RESULT: ${{ needs.validation-prepare.result }}
          VALIDATION_REUSED: ${{ needs.validation.outputs.reused }}
          GATE_VALIDATE_PR: ${{ needs.validate-pr.result }}
          GATE_VALIDATION: ${{ needs.validation.result }}
          GATE_RELEASE_CHANGELOG: ${{ needs.release-changelog.result }}
        run: >-
          [[ "$GATE_VALIDATE_PR" == success ]] || { echo "::error::Required validate-pr gate failed or was skipped.";
          exit 1; }

          [[ "$GATE_VALIDATION" == success ]] || { echo "::error::Required validation gate failed or was skipped."; exit
          1; }

          [[ "$GATE_RELEASE_CHANGELOG" == success ]] || { echo "::error::Required release-changelog gate failed or was
          skipped."; exit 1; }

          [[ "$STATIC_RESULT" == success ]] || { echo "::error::Quick checks failed."; exit 1; }

          if [[ "$CI_INCREMENTAL_TESTS" == true && "$VALIDATION_REUSED" != true ]]; then
            [[ "$PREPARE_RESULT" == success ]] || { echo "::error::Validation preparation failed or was skipped."; exit 1; }
          fi
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore verified validation artifacts
        if: needs.validation.outputs.reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validation.outputs.source_run_id }}
        run: >
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name reused-validation --dir tmp/validation

          printf 'Reusing complete validation and unchanged artifacts from run %s. Reports retain their original commit
          and run URL.\n' "$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Restore prepared application and profile evidence
        id: prepared
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-browser-inputs --dir .
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-node-test-report --dir tmp/test
      - name: Restore previously verified units
        if: env.CI_INCREMENTAL_TESTS == 'true' && needs.validation.outputs.reused != 'true' &&
          needs.validation-prepare.outputs.has_reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-reused-units --dir tmp/test/units
      - name: Type check
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run typecheck
      - name: Source tests with coverage
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: source
        run: npm --loglevel=error run test:source:coverage
      - name: Gherkin runner integration contracts
        id: runner
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run test:runner
      - name: Check coverage thresholds
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: coverage
        run: >
          npm --loglevel=error run test:coverage

          jq -r '.total | "Coverage: statements \(.statements.pct)%, branches \(.branches.pct)%, functions
          \(.functions.pct)%, lines \(.lines.pct)%."' \
            tmp/test/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run build
      - name: Acceptance tests
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: acceptance
        run: npm --loglevel=error run test:acceptance
      - name: Browser tests against the built bundle
        if: needs.validation.outputs.reused != 'true'
        id: browser
        timeout-minutes: 70
        run: |-
          if [[ "$CI_INCREMENTAL_TESTS" == true ]]; then
            node .github/scripts/ci-restore-browser.mjs
            node tests/gherkin/ci.mjs assemble
          else
            npm --loglevel=error run test:browser
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require successful browser batches
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS == 'true')
        env:
          BROWSER_BATCH_RESULT: ${{ needs.browser-validation.result }}
          HAS_WORK: ${{ needs.validation-prepare.outputs.has_work }}
        run: >-
          if [[ "$HAS_WORK" == true ]]; then
            [[ "$BROWSER_BATCH_RESULT" == success ]] || { echo "::error::Browser batch execution or checkpoint publication failed."; exit 1; }
          else
            [[ "$BROWSER_BATCH_RESULT" == skipped ]] || { echo "::error::Unexpected browser execution state."; exit 1; }
          fi
      - name: Upload browser results and diagnostics
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |-
            tmp/test/vitest-browser-chromium.json
            tmp/test/vitest-components.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
            tmp/test/browser
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload application test results
        if: ${{ !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: application-test-report
          path: |-
            tmp/test/vitest-source.json
            tmp/test/vitest-acceptance.json
            tmp/test/vitest-runner.json
            tmp/test/vitest-browser-chromium.json
            tmp/test/vitest-components.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download automation test results
        if: ${{ !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name automation-test-report --dir tmp/test
      - name: Generate combined test report
        if: needs.validation.outputs.reused != 'true'
        id: report
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm --loglevel=error run report:tests
      - name: Generate diagnostic report after failure
        id: failure-report
        if: failure() && !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success')
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          warning='CI failed. This diagnostic report does not certify a successful build.'
          REPORT_WARNING="$warning" node .github/scripts/generate-test-report.mjs tmp/test/report tmp/test/blobs
      - name: Upload failed validation diagnostics
        if: failure() && steps.failure-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |-
            tmp/test/report
            tmp/test/coverage
            !tmp/test/coverage/v8
          if-no-files-found: error
          retention-days: 7
      - name: Generate report badges
        if: needs.validation.outputs.reused != 'true'
        run: |
          npm --loglevel=error run badges:coverage
          npm --loglevel=error run badges:scenarios
      - name: Bind complete validation to its inputs and artifacts
        if: needs.validation.outputs.reused != 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          mkdir -p tmp/validation/bundle tmp/validation/coverage tmp/validation/test-report

          cp -a dist/. tmp/validation/bundle/

          cp -a tmp/test/coverage/. tmp/validation/coverage/

          rm -rf tmp/validation/coverage/v8

          cp -a tmp/test/report/. tmp/validation/test-report/

          cp -a tmp/test/badges tmp/validation/test-report/

          # Empty generated folders have no upload payload; retain every file for strict verification.

          find tmp/validation/bundle tmp/validation/coverage tmp/validation/test-report \
            -mindepth 1 -depth -type d -empty -delete
          node .github/scripts/validation-artifacts.mjs create "$REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          "$PR_HEAD_SHA" "$TESTED_SHA" tmp/validation/bundle tmp/validation/coverage
          tmp/validation/test-report/index.html tmp/validation/validation-manifest.json

          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        id: validation-proof
      - name: Upload tested bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: tmp/validation/bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tmp/validation/coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload combined test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/validation/test-report
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload original validation proof
        if: needs.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-manifest
          path: tmp/validation/validation-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    outputs:
      validation_run_attempt: ${{ steps.validation-proof.outputs.run_attempt }}

  # Cache hits skip optional ancestors; publication must check successful gates
  # explicitly instead of inheriting GitHub's implicit success() condition.
  preview:
    name: Deploy Preview
    needs: [ integration, application ]
    if: >-
      !cancelled() && needs.integration.result == 'success' && needs.application.result == 'success' &&
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    concurrency:
      group: pages-${{ github.head_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAGES_BRANCH: ${{ github.head_ref }}
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout tested automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download tested bundle
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --name bundle --dir dist || {
            echo "::error::Cannot download tested bundle from $REPOSITORY run $GITHUB_RUN_ID (branch=$PAGES_BRANCH, commit=$DEPLOY_SHA, destination=dist)." >&2
            exit 1
          }
      - name: Check preview content and destination
        id: prepare
        run: bash .github/scripts/prepare-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" dist
      - name: Create GitHub App token
        if: steps.prepare.outputs.skipped == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write
      - name: Deploy changed preview
        if: steps.prepare.outputs.deploy == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch="${{ env.PAGES_BRANCH }}"
            --commit-hash=${{ env.DEPLOY_SHA }} --commit-dirty=false --commit-message=bundle-sha256:${{
            steps.prepare.outputs.bundle_hash }}
      - name: Verify and record preview deployment
        if: (success() || (failure() && steps.cloudflare.outcome == 'failure')) && steps.prepare.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_HASH: ${{ steps.prepare.outputs.bundle_hash }}
          DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id || steps.prepare.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare.outcome == 'failure' && 'failure' || 'success' }}
        run: bash .github/scripts/record-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" "$BUNDLE_HASH"
          "$DEPLOYMENT_ID" "$DEPLOYMENT_OUTCOME"

  auto-merge:
    name: Merge Release
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [ integration, workflow-checks, validate-pr, application, preview ]
    if: >-
      !cancelled() && needs.integration.result == 'success' && needs.workflow-checks.result == 'success' &&
      needs.validate-pr.result == 'success' && needs.application.result == 'success' && needs.preview.result == 'success' &&
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    outputs:
      merge_sha: ${{ steps.release.outputs.merge_sha }}
      head_branch: ${{ steps.release.outputs.head_branch }}
      head_sha: ${{ steps.release.outputs.head_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Confirm merge of validated release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ needs.integration.outputs.base_sha }}
        run: bash .github/scripts/merge-release-pr.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_BRANCH" "$HEAD_SHA" "$BASE_SHA"

  create-release-tag:
    name: Create Release Tag
    if: >-
      !cancelled() && needs.integration.result == 'success' && needs.auto-merge.result == 'success' &&
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')
    needs: [ integration, auto-merge ]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      merge_sha: ${{ needs.auto-merge.outputs.merge_sha }}
      head_branch: ${{ needs.auto-merge.outputs.head_branch }}
      head_sha: ${{ needs.auto-merge.outputs.head_sha }}
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out tested head and release history
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto-merge.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Verify released content before tagging
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.auto-merge.outputs.head_sha }}
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
        run: |
          bash .github/scripts/validate-release-tree.sh "$HEAD_SHA" "$MERGE_SHA"
          bash .github/scripts/validate-current-release.sh "$REPOSITORY" "$MERGE_SHA"
      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ needs.auto-merge.outputs.head_branch }}
          MERGE_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail

          kind="${HEAD_BRANCH%%/*}"
          version="${HEAD_BRANCH#*/}"

          bash .github/scripts/validate-semver.sh "$version"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Cannot tag $GITHUB_REPOSITORY from '$HEAD_BRANCH': tag '$version' points to $existing; expected merge commit $MERGE_SHA." >&2
            exit 1
          fi

          bot_id="$(gh api "users/$BOT_LOGIN" --jq '.id')" || {
            echo "::error::Cannot resolve tag author '$BOT_LOGIN' for $GITHUB_REPOSITORY tag '$version' at $MERGE_SHA." >&2
            exit 1
          }
          git config user.name "$BOT_LOGIN"
          git config user.email "$bot_id+$BOT_LOGIN@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version" || {
            echo "::error::Cannot create annotated tag '$version' at $MERGE_SHA for $GITHUB_REPOSITORY ($HEAD_BRANCH)." >&2
            exit 1
          }
          git push origin "refs/tags/$version" || {
            echo "::error::Cannot push tag '$version' at $MERGE_SHA to $GITHUB_REPOSITORY via origin." >&2
            exit 1
          }

  backmerge-develop:
    name: Synchronize Released Code
    if: >-
      !cancelled() && needs.integration.result == 'success' && needs.create-release-tag.result == 'success' &&
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')
    needs: [ integration, create-release-tag ]
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release-tag.outputs.merge_sha }}
          persist-credentials: false
      - name: Open synchronization PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ needs.create-release-tag.outputs.head_branch }}
          HEAD_SHA: ${{ needs.create-release-tag.outputs.head_sha }}
          MERGE_SHA: ${{ needs.create-release-tag.outputs.merge_sha }}
        run: bash .github/scripts/synchronize-release.sh "$REPOSITORY" "$HEAD_BRANCH" "$HEAD_SHA" "$MERGE_SHA"

  promote-release:
    name: Promote Release
    if: >-
      !cancelled() && needs.integration.result == 'success' && needs.create-release-tag.result == 'success' &&
      needs.validation.result == 'success' && needs.application.result == 'success' &&
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')
    needs:
      - integration
      - create-release-tag
      - validation
      - application
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      MERGE_SHA: ${{ needs.create-release-tag.outputs.merge_sha }}
      REUSED_VALIDATION: ${{ needs.validation.outputs.reused }}
      VALIDATION_RUN_ID: ${{ needs.validation.outputs.reused == 'true' && needs.validation.outputs.source_run_id || github.run_id }}
      VALIDATION_RUN_ATTEMPT: ${{ needs.validation.outputs.reused == 'true' && needs.validation.outputs.source_run_attempt ||
        needs.application.outputs.validation_run_attempt }}
      VALIDATION_SOURCE_SHA: ${{ needs.validation.outputs.reused == 'true' && needs.validation.outputs.source_sha ||
        github.event.pull_request.head.sha }}
      VALIDATION_TESTED_SHA: ${{ needs.validation.outputs.reused == 'true' && needs.validation.outputs.tested_sha ||
        github.event.pull_request.head.sha }}
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release-tag.outputs.merge_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download release artifacts
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$REUSED_VALIDATION" == true ]]; then
            gh run download "$SOURCE_RUN_ID" --repo "$REPOSITORY" --name reused-validation --dir tmp/publication
          else
            for name in bundle coverage test-report validation-manifest; do
              gh run download "$SOURCE_RUN_ID" --repo "$REPOSITORY" --name "$name" --dir "tmp/publication/$name"
            done
          fi
          node .github/scripts/validation-artifacts.mjs verify tmp/publication/validation-manifest/validation-manifest.json tmp/publication "$REPOSITORY" "$VALIDATION_RUN_ID" "$VALIDATION_RUN_ATTEMPT" "$VALIDATION_SOURCE_SHA" "$VALIDATION_TESTED_SHA"
          mkdir -p dist
          cp -a tmp/publication/bundle/. dist/
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write
      - name: Check production content and destination
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/prepare-pages-deployment.sh "$REPOSITORY" main "$MERGE_SHA" dist
      - name: Deploy changed production bundle
        if: steps.prepare.outputs.deploy == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch=main --commit-hash=${{
            needs.create-release-tag.outputs.merge_sha }} --commit-dirty=false --commit-message=bundle-sha256:${{
            steps.prepare.outputs.bundle_hash }}
      - name: Verify and record production deployment
        if: success() || (failure() && steps.cloudflare.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_HASH: ${{ steps.prepare.outputs.bundle_hash }}
          DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id || steps.prepare.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare.outcome == 'failure' && 'failure' || 'success' }}
        run: bash .github/scripts/record-pages-deployment.sh "$REPOSITORY" main "$MERGE_SHA" "$BUNDLE_HASH" "$DEPLOYMENT_ID"
          "$DEPLOYMENT_OUTCOME"
      - name: Publish test reports and badges
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash .github/scripts/validate-current-release.sh "$REPOSITORY" "$MERGE_SHA"
          node .github/scripts/publish-report.mjs tmp/publication/test-report "reports/$MERGE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" tmp/publication/validation-manifest/validation-manifest.json
      - name: Report links
        run: |
          echo '[Tests and coverage](https://status.operations.superduper.solutions/test-report.html)' >> "$GITHUB_STEP_SUMMARY"
env:
  CI_INCREMENTAL_TESTS: ${{ vars.CI_INCREMENTAL_TESTS != 'false' && 'true' || 'false' }}
  CI_BROWSER_CAPTURE: ${{ vars.CI_BROWSER_CAPTURE || 'minimal' }}
