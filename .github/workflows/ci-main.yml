name: ci-main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  # Only superseded PR checks are cancelled; deployment must finish independently.
  group: main-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Automation Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint standalone scripts
        run: shellcheck .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test automation
        id: automation
        run: npm --loglevel=error run test:automation

      - name: Upload automation report
        if: success() || (failure() && steps.automation.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-report
          path: tmp/test/cucumber-automation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  validate-pr:
    name: Validate Gitflow
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr.sh "$REPOSITORY" "$HEAD_BRANCH" "$BASE_BRANCH" "$HEAD_SHA"

  create-release:
    name: Create Release
    needs: workflow-checks
    if: >-
      github.event_name == 'pull_request'
      && github.head_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    concurrency:
      group: release-creation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/create-release-pr.sh "$REPOSITORY" "$SOURCE_PR" "$SOURCE_SHA"

  application:
    name: Test and Build Release
    needs: validate-pr
    if: github.event_name == 'pull_request' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release head
        uses: actions/checkout@v7
        with:
          # Deployment resolves this exact PR head and consumes its artifacts.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm --loglevel=error run typecheck

      - name: Source tests with coverage
        run: npm --loglevel=error run test:source:coverage

      - name: Check coverage and prepare status
        id: coverage
        run: |
          npm --loglevel=error run coverage -- --reporter=json-summary
          value="$(jq -er '.total.statements.pct | numbers' tmp/test/coverage/coverage-summary.json)" || {
            echo '::error::tmp/test/coverage/coverage-summary.json is missing a numeric total.statements.pct coverage percentage; cannot generate tmp/status/coverage.json.' >&2
            exit 1
          }
          mkdir -p tmp/status
          jq -n --arg message "${value}%" \
            '{schemaVersion: 1, label: "Test Coverage", message: $message, color: "brightgreen"}' \
            > tmp/status/coverage.json
          jq -r '.total | "Coverage: statements \(.statements.pct)%, branches \(.branches.pct)%, functions \(.functions.pct)%, lines \(.lines.pct)%."' \
            tmp/test/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm --loglevel=error run build

      - name: Acceptance tests
        id: acceptance
        run: npm --loglevel=error run test:acceptance

      - name: Upload failed acceptance report
        if: failure() && steps.acceptance.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage report
        if: success() || (failure() && steps.coverage.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            tmp/test/coverage
            !tmp/test/coverage/v8
          if-no-files-found: error
          overwrite: true

      - name: Upload coverage status
        uses: actions/upload-artifact@v7
        with:
          name: coverage-status
          path: tmp/status/coverage.json
          if-no-files-found: error
          overwrite: true

  auto-merge:
    name: Auto Merge
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [workflow-checks, validate-pr, application]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA"

  create-release-tag:
    name: Create Release Tag
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.release-pr.outputs.pr_number }}
      head_sha: ${{ steps.release-pr.outputs.head_sha }}
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve merged release
        id: release-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: bash .github/scripts/find-release-pr.sh "$REPOSITORY" "$MERGE_SHA"

      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ steps.release-pr.outputs.head_branch }}
          MERGE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail

          kind="${HEAD_BRANCH%%/*}"
          version="${HEAD_BRANCH#*/}"

          bash .github/scripts/validate-semver.sh "$version"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Cannot tag $GITHUB_REPOSITORY from '$HEAD_BRANCH': tag '$version' points to $existing; expected merge commit $MERGE_SHA." >&2
            exit 1
          fi

          bot_id="$(gh api "users/$BOT_LOGIN" --jq '.id')" || {
            echo "::error::Cannot resolve tag author '$BOT_LOGIN' for $GITHUB_REPOSITORY tag '$version' at $MERGE_SHA." >&2
            exit 1
          }
          git config user.name "$BOT_LOGIN"
          git config user.email "$bot_id+$BOT_LOGIN@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version" || {
            echo "::error::Cannot create annotated tag '$version' at $MERGE_SHA for $GITHUB_REPOSITORY ($HEAD_BRANCH)." >&2
            exit 1
          }
          git push origin "refs/tags/$version" || {
            echo "::error::Cannot push tag '$version' at $MERGE_SHA to $GITHUB_REPOSITORY via origin." >&2
            exit 1
          }

  backmerge-develop:
    name: Synchronize Develop
    needs: create-release-tag
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open synchronization PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          behind_by="$(gh api "repos/$REPOSITORY/compare/main...develop" --jq '.behind_by')" || {
            echo "::error::Cannot compare main...develop in $REPOSITORY before synchronization." >&2
            exit 1
          }
          if [[ "$behind_by" == "0" ]]; then
            exit 0
          fi
          pr_url="$(gh api --method GET "repos/$REPOSITORY/pulls" \
            -f state=open -f base=develop -f "head=${REPOSITORY%%/*}:main" \
            --jq '.[0].html_url // empty')" || {
            echo "::error::Cannot find an open synchronization PR in $REPOSITORY (head=main, base=develop)." >&2
            exit 1
          }
          if [[ -z "$pr_url" ]]; then
            pr_url="$(gh api --method POST "repos/$REPOSITORY/pulls" \
              -f base=develop -f head=main -f title="Synchronize main into develop" \
              -f body="Synchronize released code. CI validates and merges this PR." \
              --jq '.html_url')" || {
              echo "::error::Cannot create synchronization PR in $REPOSITORY (head=main, base=develop, behind_by=$behind_by)." >&2
              exit 1
            }
          fi
          echo "Synchronization: $pr_url" >> "$GITHUB_STEP_SUMMARY"

  promote-release:
    name: Promote Release
    needs: create-release-tag
    # Keep all production writes in one serialized job. Tagging remains independent.
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      MERGE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Wait for validated release artifacts
        id: release
        env:
          PR_NUMBER: ${{ needs.create-release-tag.outputs.pr_number }}
          HEAD_SHA: ${{ needs.create-release-tag.outputs.head_sha }}
        run: bash .github/scripts/find-release-ci.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"

      - name: Download release artifacts
        env:
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          for artifact in bundle:dist coverage:tmp/coverage coverage-status:tmp/status; do
            name="${artifact%%:*}"
            directory="${artifact#*:}"
            gh run download "$SOURCE_RUN_ID" --repo "$REPOSITORY" --name "$name" --dir "$directory" || {
              echo "::error::Cannot download artifact '$name' from $REPOSITORY run $SOURCE_RUN_ID to '$directory' for release $MERGE_SHA." >&2
              exit 1
            }
          done

      - name: Bundle coverage report
        run: |
          npx --yes coverage-single-html@0.1.4 tmp/coverage \
            --output tmp/coverage.html --title "Test Coverage Report"
          npx --yes html-minifier-terser@7.2.0 tmp/coverage.html \
            --collapse-whitespace --remove-comments --remove-redundant-attributes \
            --remove-script-type-attributes --remove-style-link-type-attributes \
            --minify-css true --minify-js true --output tmp/test-coverage.html
          test -s tmp/test-coverage.html || {
            echo '::error::Coverage report bundling produced no HTML: tmp/test-coverage.html (source=tmp/coverage, intermediate=tmp/coverage.html). Publishing stopped.' >&2
            exit 1
          }

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write

      - name: Validate production destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo "::error::Missing CLOUDFLARE_PAGES_API_TOKEN: cannot deploy $REPOSITORY at $MERGE_SHA (source=dist, project=operations-superduper-solutions, branch=main)." >&2
            exit 1
          }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID: cannot deploy $REPOSITORY at $MERGE_SHA (source=dist, project=operations-superduper-solutions, branch=main)." >&2
            exit 1
          }
          bash .github/scripts/validate-current-release.sh "$REPOSITORY" "$MERGE_SHA"

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch=main

      - name: Record GitHub deployment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          deployment_id="$(gh api --method POST "repos/$REPOSITORY/deployments" \
            -f ref="$MERGE_SHA" -F auto_merge=false -F 'required_contexts[]' \
            -f environment=production -F production_environment=true \
            -f description="Cloudflare Pages" --jq '.id')" || {
            echo "::error::Cannot record deployment for $REPOSITORY at $MERGE_SHA (environment=production, URL=$DEPLOYMENT_URL)." >&2
            exit 1
          }
          gh api --method POST "repos/$REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success -f environment=production -f environment_url="$DEPLOYMENT_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || {
            echo "::error::Cannot record successful status for deployment $deployment_id in $REPOSITORY at $MERGE_SHA (environment=production, URL=$DEPLOYMENT_URL)." >&2
            exit 1
          }

      - name: Publish coverage report and status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash .github/scripts/validate-current-release.sh "$REPOSITORY" "$MERGE_SHA"
          bash .github/scripts/publish-status.sh tmp/test-coverage.html test-coverage.html 'text/html; charset=utf-8'
          bash .github/scripts/validate-current-release.sh "$REPOSITORY" "$MERGE_SHA"
          bash .github/scripts/publish-status.sh tmp/status/coverage.json coverage.json application/json

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          echo "Deployed $DEPLOYMENT_URL from CI run #$SOURCE_RUN_ID." >> "$GITHUB_STEP_SUMMARY"
