name: update-dependencies-preview

on:
  push:
    branches:
      - feature/dev-dependencies-only
    paths:
      - .github/workflows/update-dependencies-preview.yml

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Update selected dependencies
        run: |
          npm install --save-dev --save-exact \
            bits-ui@2.19.5 \
            @lucide/svelte@1.50.0 \
            @xyflow/svelte@1.7.0 \
            cn@0.4.0 \
            tailwind-variants@3.3.1

      - name: Upload regenerated manifests
        uses: actions/upload-artifact@v6
        with:
          name: dependency-update
          path: |
            package.json
            package-lock.json
