name: update-dependencies-preview

on:
  push:
    branches:
      - feature/dev-dependencies-only
    paths:
      - .github/workflows/update-dependencies-preview.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/dev-dependencies-only

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Update selected dependencies
        run: |
          npm install --save-dev --save-exact \
            bits-ui@2.19.5 \
            @lucide/svelte@1.50.0 \
            @xyflow/svelte@1.7.0 \
            cn@0.4.0 \
            tailwind-variants@3.3.1

      - name: Commit regenerated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update frontend dependencies"
          git push origin HEAD:feature/dev-dependencies-only
