  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          previous_sha="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty'
          )"

          {
            echo "**Preview URL:** ${DEPLOYMENT_URL}"
            echo
            echo "### Commits"

            if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              mapfile -t deployed_commits < <(
                git rev-list --reverse "${previous_sha}..${GITHUB_SHA}"
              )
            else
              deployed_commits=("${GITHUB_SHA}")
            fi

            for squash_sha in "${deployed_commits[@]}"; do
              pr_number="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "repos/${GITHUB_REPOSITORY}/commits/${squash_sha}/pulls" |
                jq -r \
                  --arg sha "$squash_sha" \
                  '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)][0].number // empty'
              )"

              if [[ -z "$pr_number" ]]; then
                git log -1 \
                  --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
                  "$squash_sha"
                continue
              fi

              base_sha="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                  --jq '.base.sha'
              )"

              pr_commits="$(
                gh api \
                  --paginate \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/commits?per_page=100" |
                jq -s 'add'
              )"

              sync_index="$(
                printf '%s' "$pr_commits" |
                jq \
                  --arg base "$base_sha" \
                  '[
                    to_entries[]
                    | select(
                        (.value.parents | length) > 1
                        and any(.value.parents[]; .sha == $base)
                      )
                    | .key
                  ] | max // -1'
              )"

              expanded="$(
                printf '%s' "$pr_commits" |
                jq -r \
                  --argjson start "$sync_index" \
                  --arg repo "$GITHUB_REPOSITORY" \
                  '
                    to_entries[]
                    | select(.key > $start)
                    | .value
                    | (.commit.message | split("\n")[0]) as $message
                    | select($message != "Merge main into develop")
                    | "- [\(.sha[0:7])](https://github.com/\($repo)/commit/\(.sha)) \($message)"
                  '
              )"

              git log -1 \
                --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
                "$squash_sha"

