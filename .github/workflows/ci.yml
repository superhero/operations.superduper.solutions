name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  installation:
    name: Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

  type-check:
    name: Type Check
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Type Check
        run: npx --no-install tsc --project tsconfig.json --noEmit

  bundle:
    name: Bundle
    needs: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bundle
        run: npx --no-install vite build

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error

  test:
    name: Test
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Test
        run: npm test

      - name: Hand off test report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: temp/test/cucumber-test.json
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Coverage
        run: npm run coverage

      - name: Hand off coverage report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: temp/test/coverage
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

  test-report:
    name: Test Report
    needs: test
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore test report
        uses: actions/cache/restore@v6
        with:
          path: temp/test/cucumber-test.json
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: temp/test/cucumber-test.json
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: coverage
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_sha="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty'
          )"

          {
            echo "## Deployment"
            echo
            echo "### Commits"

            if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              git log --reverse --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${previous_sha}..${GITHUB_SHA}"
            else
              git log -1 --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${GITHUB_SHA}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-report:
    name: Coverage Report
    needs:
      - coverage
      - test-report
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore coverage report
        uses: actions/cache/restore@v6
        with:
          path: temp/test/coverage
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: temp/test/coverage
          if-no-files-found: warn
