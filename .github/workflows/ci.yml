name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist
          if-no-files-found: error

  build-report:
    name: Build Report
    needs: build
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Publish build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: dist
          if-no-files-found: warn

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Test
        run: npm test

      - name: Hand off test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-report-data
          path: temp/test/cucumber-test.json
          if-no-files-found: warn
          retention-days: 1

  test-report:
    name: Test Report
    needs: test
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Download test report data
        uses: actions/download-artifact@v8
        with:
          name: test-report-data
          path: temp/test

      - name: Publish test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: temp/test/cucumber-test.json
          if-no-files-found: warn

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Coverage
        run: npm run coverage

      - name: Hand off coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-data
          path: temp/test/coverage
          if-no-files-found: warn
          retention-days: 1

  coverage-report:
    name: Coverage Report
    needs: coverage
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage report data
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-data
          path: temp/test/coverage

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: temp/test/coverage
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: coverage
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
