name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  topology:
    name: Gitflow topology
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gitflow topology and version rules
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head="$HEAD_BRANCH"
          base="$BASE_BRANCH"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "Validating PR topology: $head -> $base"

          case "$base" in
            main)
              case "$head" in
                release/*|hotfix/*) ;;
                *) fail "Invalid Gitflow topology: only release/* or hotfix/* may merge into main." ;;
              esac
              ;;
            *)
              fail "CI only validates pull requests targeting 'main', got '$base'."
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+  installation:
    name: Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

  type-check:
    name: Type Check
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Type Check
        run: npm --silent run typecheck

  source-test:
    name: Source Test
    needs: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Source Test
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run test:source:coverage 2>&1 | tee tmp/test/source-test-output.txt

      - name: Hand off source test data
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/source-test-output.txt
            tmp/test/coverage/v8
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Coverage
    needs: source-test
    outputs:
      statements: ${{ steps.coverage.outputs.statements }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore source coverage data
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/source-test-output.txt
            tmp/test/coverage/v8
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Coverage
        id: coverage
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run coverage 2>&1 | tee tmp/test/coverage-output.txt

          value="$(grep -E 'Statements[[:space:]]*:' tmp/test/coverage-output.txt | tail -1 | sed -E 's/.*:[[:space:]]*([0-9]+(\.[0-9]+)?)%.*/\1/')"
          test -n "$value"
          echo "statements=$value" >> "$GITHUB_OUTPUT"

      - name: Hand off coverage report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/coverage
            tmp/test/coverage-output.txt
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

  bundle:
    name: Bundle
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bundle
        run: npm --silent run build

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error

  test:
    name: Acceptance Test
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Acceptance Test
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run test:acceptance 2>&1 | tee tmp/test/test-output.txt

      - name: Hand off test report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

  test-report:
    name: Test Report
    needs:
      - source-test
      - coverage
      - test
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore source test output
        uses: actions/cache/restore@v6
        with:
          path: tmp/test/source-test-output.txt
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore acceptance test report
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test summary
        if: always()
        run: |
          {
            echo '```text'

            if [[ -f tmp/test/source-test-output.txt ]]; then
              sed -E 's/[[:space:]]+# .*:[0-9]+$//' tmp/test/source-test-output.txt
              echo
            else
              echo "No source test output was produced."
              echo
            fi

            if [[ -f tmp/test/test-output.txt ]]; then
              sed -E 's/[[:space:]]+# .*:[0-9]+$//' tmp/test/test-output.txt
            else
              echo "No acceptance test output was produced."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          previous_sha="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty'
          )"

          {
            echo "**Preview URL:** ${DEPLOYMENT_URL}"
            echo
            echo "### Commits"

            if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              mapfile -t deployed_commits < <(
                git rev-list --reverse "${previous_sha}..${GITHUB_SHA}"
              )
            else
              deployed_commits=("${GITHUB_SHA}")
            fi

            for squash_sha in "${deployed_commits[@]}"; do
              pr_number="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "repos/${GITHUB_REPOSITORY}/commits/${squash_sha}/pulls" |
                jq -r \
                  --arg sha "$squash_sha" \
                  '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)][0].number // empty'
              )"

              if [[ -z "$pr_number" ]]; then
                git log -1 \
                  --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
                  "$squash_sha"
                continue
              fi

              base_sha="$(
                gh api \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                  --jq '.base.sha'
              )"

              pr_commits="$(
                gh api \
                  --paginate \
                  "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/commits?per_page=100" |
                jq -s 'add'
              )"

              sync_index="$(
                printf '%s' "$pr_commits" |
                jq \
                  --arg base "$base_sha" \
                  '[
                    to_entries[]
                    | select(
                        (.value.parents | length) > 1
                        and any(.value.parents[]; .sha == $base)
                      )
                    | .key
                  ] | max // -1'
              )"

              expanded="$(
                printf '%s' "$pr_commits" |
                jq -r \
                  --argjson start "$sync_index" \
                  --arg repo "$GITHUB_REPOSITORY" \
                  '
                    to_entries[]
                    | select(.key > $start)
                    | .value
                    | (.commit.message | split("\n")[0]) as $message
                    | select($message != "Merge main into develop")
                    | "- [\(.sha[0:7])](https://github.com/\($repo)/commit/\(.sha)) \($message)"
                  '
              )"

              git log -1 \
                --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" \
                "$squash_sha"

              if [[ -n "$expanded" ]]; then
                printf '%s\n' "$expanded" | sed 's/^/  /'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-report:
    name: Coverage Report
    needs:
      - coverage
      - test-report
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore coverage report
        uses: actions/cache/restore@v6
