name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  installation:
    name: Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

  type-check:
    name: Type Check
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Type Check
        run: npx --no-install tsc --project tsconfig.json --noEmit

  bundle:
    name: Bundle
    needs: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bundle
        run: npx --no-install vite build

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error

  test:
    name: Test
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Test
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent test 2>&1 | tee tmp/test/test-output.txt

      - name: Hand off test report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Coverage
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run coverage 2>&1 | tee tmp/test/coverage-output.txt

      - name: Hand off coverage report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/coverage
            tmp/test/coverage-output.txt
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

  test-report:
    name: Test Report
    needs: test
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore test report
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test summary
        if: always()
        run: |
          {
            echo '```text'
            if [[ -f tmp/test/test-output.txt ]]; then
              sed -E 's/[[:space:]]+# .*:[0-9]+$//' tmp/test/test-output.txt
            else
              echo "No test output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: coverage
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          previous_sha="$(
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch="${GITHUB_REF_NAME}" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].head_sha // empty'
          )"

          {
            echo "**Preview URL:** ${DEPLOYMENT_URL}"
            echo
            echo "### Commits"

            if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
              git log --reverse --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${previous_sha}..${GITHUB_SHA}"
            else
              git log -1 --format="- [%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" "${GITHUB_SHA}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-report:
    name: Coverage Report
    needs:
      - coverage
      - test-report
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore coverage report
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/coverage
            tmp/test/coverage-output.txt
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '```text'
            if [[ -f tmp/test/coverage-output.txt ]]; then
              if grep -q "Coverage summary" tmp/test/coverage-output.txt; then
                awk '/Coverage summary/{show=1} show' tmp/test/coverage-output.txt
              else
                cat tmp/test/coverage-output.txt
              fi
            else
              echo "No coverage output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tmp/test/coverage
          if-no-files-found: warn
