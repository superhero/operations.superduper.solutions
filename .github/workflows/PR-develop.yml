name: PR-develop
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  # Validate proposed development changes before merging, not on the resulting push.
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: development-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-branch-direction:
    name: Validate Branch Direction
    runs-on: ubuntu-latest

    steps:
      - name: Validating
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                feature/*|bugfix/*|release/*|hotfix/*|main) ;;
                *)
                  echo "::error::Invalid Gitflow direction: '$HEAD_BRANCH' may not merge into 'develop'."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::PR-develop only validates pull requests targeting 'develop', got '$BASE_BRANCH'."
              exit 1
              ;;
          esac

          echo "Branch direction is valid: $HEAD_BRANCH -> $BASE_BRANCH"

  validate-release:
    name: Validate Release
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Validating
        shell: bash
        run: |
          set -euo pipefail

          version="${HEAD_BRANCH#release/}"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          [[ "$version" =~ $semver_re ]] || {
            echo "::error::Release version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."
            exit 1
          }

          if gh api "repos/$REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Version tag '$version' already exists."
            exit 1
          fi

          mapfile -t active_releases < <(
            gh api --paginate "repos/$REPOSITORY/git/matching-refs/heads/release/" \
              --jq '.[].ref | sub("^refs/heads/"; "")'
          )

          other_releases=0
          for branch in "${active_releases[@]:-}"; do
            [[ -z "$branch" || "$branch" == "$HEAD_BRANCH" ]] && continue

            branch_version="${branch#release/}"
            if gh api "repos/$REPOSITORY/git/ref/tags/$branch_version" >/dev/null 2>&1; then
              continue
            fi

            other_releases=$((other_releases + 1))
          done

          (( other_releases == 0 )) || {
            echo "::error::AVH default permits only one active release/* branch at a time."
            exit 1
          }

          echo "Release validation passed for $HEAD_BRANCH."

  validate-hotfix:
    name: Validate Hotfix
    if: startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.head_ref }}
      BASE_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Validating
        shell: bash
        run: |
          set -euo pipefail

          version="${HEAD_BRANCH#hotfix/}"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          [[ "$version" =~ $semver_re ]] || {
            echo "::error::Hotfix version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."
            exit 1
          }

          if gh api "repos/$REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Version tag '$version' already exists."
            exit 1
          fi

          mapfile -t active_hotfixes < <(
            gh api --paginate "repos/$REPOSITORY/git/matching-refs/heads/hotfix/" \
              --jq '.[].ref | sub("^refs/heads/"; "")'
          )

          other_hotfixes=0
          for branch in "${active_hotfixes[@]:-}"; do
            [[ -z "$branch" || "$branch" == "$HEAD_BRANCH" ]] && continue

            branch_version="${branch#hotfix/}"
            if gh api "repos/$REPOSITORY/git/ref/tags/$branch_version" >/dev/null 2>&1; then
              continue
            fi

            other_hotfixes=$((other_hotfixes + 1))
          done

          (( other_hotfixes == 0 )) || {
            echo "::error::AVH default permits only one active hotfix/* branch at a time."
            exit 1
          }

          mapfile -t semver_tags < <(
            gh api --paginate "repos/$REPOSITORY/tags?per_page=100" --jq '.[].name' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -Vr
          )

          latest_tag=""
          for tag in "${semver_tags[@]:-}"; do
            [[ -z "$tag" ]] && continue

            behind_by="$(
              gh api "repos/$REPOSITORY/compare/$tag...$BASE_BRANCH" --jq '.behind_by'
            )"

            if [[ "$behind_by" == "0" ]]; then
              latest_tag="$tag"
              break
            fi
          done

          if [[ -n "$latest_tag" ]]; then
            IFS=. read -r major minor patch <<< "$latest_tag"
            expected="$major.$minor.$((patch + 1))"

            [[ "$version" == "$expected" ]] || {
              echo "::error::Hotfix '$version' must be the next patch after '$latest_tag': expected '$expected'."
              exit 1
            }
          fi

          echo "Hotfix validation passed for $HEAD_BRANCH."


  installation:
    name: Installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

  type-check:
    name: Type Check
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Type Check
        run: npm --silent run typecheck

  test:
    name: Test
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test
        run: npm --silent run test:source

  build:
    name: Build
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: npm --silent run build
