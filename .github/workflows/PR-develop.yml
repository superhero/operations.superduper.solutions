name: PR-develop
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  # Validate proposed development changes before merging, not on the resulting push.
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: development-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology:
    # Keep the existing required check name; GitHub reports this job's actual result.
    name: Gitflow topology
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR direction
        id: validate
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head="$HEAD_BRANCH"
          base="$BASE_BRANCH"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "Validating PR topology: $head -> $base"

          case "$base" in
            develop)
              case "$head" in
                feature/*|bugfix/*|release/*|hotfix/*|main) ;;
                *) fail "Invalid Gitflow topology: '$head' may not merge into 'develop'." ;;
              esac
              ;;
            *)
              fail "Development CI only validates pull requests targeting 'develop', got '$base'."
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          version=""
          kind=""
          case "$head" in
            release/*)
              kind="release"
              version="${head#release/}"
              ;;
            hotfix/*)
              kind="hotfix"
              version="${head#hotfix/}"
              ;;
          esac

          if [[ -n "$version" ]]; then
            [[ "$version" =~ $semver_re ]] ||
              fail "$kind branch version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."

            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              fail "Version tag '$version' already exists."
            fi
          fi

          if [[ "$kind" == "release" ]]; then
            mapfile -t active_releases < <(
              git ls-remote --heads origin 'refs/heads/release/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_releases=0
            for branch in "${active_releases[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#release/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_releases=$((other_releases + 1))
            done
            (( other_releases == 0 )) ||
              fail "AVH default permits only one active release/* branch at a time."
          fi

          if [[ "$kind" == "hotfix" ]]; then
            mapfile -t active_hotfixes < <(
              git ls-remote --heads origin 'refs/heads/hotfix/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_hotfixes=0
            for branch in "${active_hotfixes[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#hotfix/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_hotfixes=$((other_hotfixes + 1))
            done
            (( other_hotfixes == 0 )) ||
              fail "AVH default permits only one active hotfix/* branch at a time."

            git fetch --quiet origin "$base" --tags --force || true

            latest_tag="$(
              git tag --merged "origin/$base" 2>/dev/null |
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1 || true
            )"

            if [[ -n "$latest_tag" ]]; then
              IFS=. read -r major minor patch <<< "$latest_tag"
              expected="$major.$minor.$((patch + 1))"
              [[ "$version" == "$expected" ]] ||
                fail "Hotfix '$version' must be the next patch after '$latest_tag': expected '$expected'."
            fi
          fi

          echo "Gitflow topology is valid."

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type Check
        run: npm --silent run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm --silent run test:source

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm --silent run build
