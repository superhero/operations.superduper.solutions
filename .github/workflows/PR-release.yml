name: PR-release
run-name: 'PR-release #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}'

on:
  pull_request:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  topology:
    name: Gitflow topology
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR direction and version rules
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head="$HEAD_BRANCH"
          base="$BASE_BRANCH"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "Validating PR topology: $head -> $base"

          [[ "$base" == release/* ]] ||
            fail "This workflow only validates PRs targeting release/*, got '$base'."
          [[ "$head" == hotfix/* ]] ||
            fail "Invalid Gitflow topology: only hotfix/* may merge into release/*."

          version="${head#hotfix/}"
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver_re ]] ||
            fail "hotfix branch version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            fail "Version tag '$version' already exists."
          fi

          mapfile -t active_hotfixes < <(
            git ls-remote --heads origin 'refs/heads/hotfix/*' |
              awk '{sub("refs/heads/","",$2); print $2}'
          )
          other_hotfixes=0
          for branch in "${active_hotfixes[@]:-}"; do
            [[ -z "$branch" || "$branch" == "$head" ]] && continue
            branch_version="${branch#hotfix/}"
            git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
            other_hotfixes=$((other_hotfixes + 1))
          done
          (( other_hotfixes == 0 )) ||
            fail "AVH default permits only one active hotfix/* branch at a time."

          git fetch --quiet origin "$base" --tags --force || true

          latest_tag="$(
            git tag --merged "origin/$base" 2>/dev/null |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -n "$latest_tag" ]]; then
            IFS=. read -r major minor patch <<< "$latest_tag"
            expected="$major.$minor.$((patch + 1))"
            [[ "$version" == "$expected" ]] ||
              fail "Hotfix '$version' must be the next patch after '$latest_tag': expected '$expected'."
          fi

          echo "Gitflow topology is valid."
