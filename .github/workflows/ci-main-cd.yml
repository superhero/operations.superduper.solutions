name: ci-main-cd
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  create-release-tag:
    name: Create Release Tag
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          kind="${HEAD_BRANCH%%/*}"
          version="${HEAD_BRANCH#*/}"

          bash .github/scripts/validate-semver.sh "$version"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Tag '$version' already exists on a different commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version"
          git push origin "refs/tags/$version"

  deploy-release:
    name: Deploy Release
    needs: create-release-tag
    outputs:
      source_run_id: ${{ steps.release.outputs.run_id }}
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Download validated bundle
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow ci-main.yml \
              --event pull_request \
              --commit "$HEAD_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          [[ -n "$run_id" ]] || {
            echo "::error::No successful release CI run found for PR #$PR_NUMBER at $HEAD_SHA." >&2
            exit 1
          }

          mkdir -p dist
          gh run download "$run_id" \
            --repo "$REPOSITORY" \
            --name bundle \
            --dir dist

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions." >&2
          exit 1

      - name: Deploy validated bundle to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          set -euo pipefail

          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$MERGE_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "**Preview URL:** $DEPLOYMENT_URL"
            echo
            echo "**Promoted artifact:** CI run #$SOURCE_RUN_ID"
            echo
            echo "**Source:** PR #$PR_NUMBER ($SOURCE_BRANCH @ ${SOURCE_SHA:0:7})"
          } >> "$GITHUB_STEP_SUMMARY"



  publish-coverage-status:
    name: Publish Coverage Status
    needs: deploy-release
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Download validated coverage status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.deploy-release.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p tmp/badges
          gh run download "$SOURCE_RUN_ID" \
            --repo "$REPOSITORY" \
            --name coverage-status \
            --dir tmp/badges

      - name: Publish coverage status to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            echo "::error::Cloudflare R2 credentials are not configured in GitHub Actions." >&2
            exit 1
          }

          response="$(
            curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @tmp/badges/coverage.json \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/operations-status/objects/coverage.json"
          )"

          jq -e '.success == true' <<<"$response" >/dev/null

  backmerge-develop:
    name: Backmerge Develop
    needs: create-release-tag
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITHUB_APP_CLIENT_ID || vars.GH_APP_CLIENT_ID }}
          app-id: ${{ vars.GH_APP_ID || vars.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY || secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Backmerge main into develop
        id: sync
        shell: bash
        env:
          PR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$(gh api "repos/$REPOSITORY/compare/main...develop" --jq '.behind_by')" == "0" ]]; then
            echo "develop already contains main; no synchronization is needed."
            exit 0
          fi

          pr_number="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f base=develop -f "head=${REPOSITORY%%/*}:main" \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            pr_number="$(
              GH_TOKEN="$PR_TOKEN" gh api --method POST "repos/$REPOSITORY/pulls" \
                -f base=develop -f head=main \
                -f title="Back-merge main into develop" \
                -f body="Automatic Gitflow synchronization. Development checks run on this pull request." \
                --jq '.number'
            )"
          fi

          for attempt in {1..50}; do
            if result="$(
              gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" \
                -f merge_method=merge -f "sha=$main_sha" 2>&1
            )"; then
              break
            fi

            if [[ "$result" != *"HTTP 405"* || "$attempt" == "50" ]]; then
              printf '%s\n' "$result" >&2
              exit 1
            fi

            sleep 5
          done

          merge_sha="$(jq -er 'select(.merged == true) | .sha' <<<"$result")" || {
            echo "::error::GitHub did not merge the synchronization PR." >&2
            exit 1
          }

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Synchronization summary
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MERGED: ${{ steps.sync.outputs.merged }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          if [[ "$MERGED" == "true" ]]; then
            echo "Merged main into develop through PR #$PR_NUMBER at $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SYNC_OUTCOME" == "success" ]]; then
            echo "develop already contains main; no back-merge was needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Synchronization did not complete; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
