name: ci-main-cd
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  create-release-tag:
    name: Create Release Tag
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          kind="${HEAD_BRANCH%%/*}"
          version="${HEAD_BRANCH#*/}"

          bash .github/scripts/validate-semver.sh "$version"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Tag '$version' already exists on a different commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version"
          git push origin "refs/tags/$version"

  promote-release:
    name: Promote Release
    needs: create-release-tag
    # Serialize deployment and all status publishing, while allowing every
    # merged release to be tagged even if a pending deployment is superseded.
    concurrency:
      group: production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/release-deployment.yml
    secrets: inherit

  backmerge-develop:
    name: Backmerge Develop
    needs: create-release-tag
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Backmerge main into develop
        id: sync
        shell: bash
        env:
          PR_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$(gh api "repos/$REPOSITORY/compare/main...develop" --jq '.behind_by')" == "0" ]]; then
            echo "develop already contains main; no synchronization is needed."
            exit 0
          fi

          pr_number="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f base=develop -f "head=${REPOSITORY%%/*}:main" \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            pr_number="$(
              GH_TOKEN="$PR_TOKEN" gh api --method POST "repos/$REPOSITORY/pulls" \
                -f base=develop -f head=main \
                -f title="Back-merge main into develop" \
                -f body="Automatic Gitflow synchronization. Development checks run on this pull request." \
                --jq '.number'
            )"
          fi

          for attempt in {1..50}; do
            if result="$(
              gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" \
                -f merge_method=merge -f "sha=$main_sha" 2>&1
            )"; then
              break
            fi

            if [[ "$result" != *"HTTP 405"* || "$attempt" == "50" ]]; then
              printf '%s\n' "$result" >&2
              exit 1
            fi

            sleep 5
          done

          merge_sha="$(jq -er 'select(.merged == true) | .sha' <<<"$result")" || {
            echo "::error::GitHub did not merge the synchronization PR." >&2
            exit 1
          }

          {
            echo "pr_number=$pr_number"
            echo "merge_sha=$merge_sha"
            echo "merged=true"
          } >> "$GITHUB_OUTPUT"

      - name: Synchronization summary
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MERGED: ${{ steps.sync.outputs.merged }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          if [[ "$MERGED" == "true" ]]; then
            echo "Merged main into develop through PR #$PR_NUMBER at $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SYNC_OUTCOME" == "success" ]]; then
            echo "develop already contains main; no back-merge was needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Synchronization did not complete; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
