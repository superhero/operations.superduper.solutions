name: Development CI

on:
  push:
    branches:
      - develop
  # PRs need topology validation only. Never execute PR code in this event.
  # GITHUB_TOKEN-created back-merges are handled entirely by post-release.yml.
  pull_request_target:
    branches:
      - develop
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact develop commit to check (defaults to the workflow commit)
        required: false
        type: string

concurrency:
  group: development-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology:
    name: Validate pull-request topology
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gitflow topology and version rules
        id: validate
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head="$HEAD_BRANCH"
          base="$BASE_BRANCH"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "Validating PR topology: $head -> $base"

          case "$base" in
            develop)
              case "$head" in
                feature/*|bugfix/*|release/*|hotfix/*|main) ;;
                *) fail "Invalid Gitflow topology: '$head' may not merge into 'develop'." ;;
              esac
              ;;
            *)
              fail "Development CI only validates pull requests targeting 'develop', got '$base'."
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          version=""
          kind=""
          case "$head" in
            release/*)
              kind="release"
              version="${head#release/}"
              ;;
            hotfix/*)
              kind="hotfix"
              version="${head#hotfix/}"
              ;;
          esac

          if [[ -n "$version" ]]; then
            [[ "$version" =~ $semver_re ]] ||
              fail "$kind branch version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."

            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              fail "Version tag '$version' already exists."
            fi
          fi

          if [[ "$kind" == "release" ]]; then
            mapfile -t active_releases < <(
              git ls-remote --heads origin 'refs/heads/release/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_releases=0
            for branch in "${active_releases[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#release/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_releases=$((other_releases + 1))
            done
            (( other_releases == 0 )) ||
              fail "AVH default permits only one active release/* branch at a time."
          fi

          if [[ "$kind" == "hotfix" ]]; then
            mapfile -t active_hotfixes < <(
              git ls-remote --heads origin 'refs/heads/hotfix/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_hotfixes=0
            for branch in "${active_hotfixes[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#hotfix/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_hotfixes=$((other_hotfixes + 1))
            done
            (( other_hotfixes == 0 )) ||
              fail "AVH default permits only one active hotfix/* branch at a time."

            git fetch --quiet origin "$base" --tags --force || true

            latest_tag="$(
              git tag --merged "origin/$base" 2>/dev/null |
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1 || true
            )"

            if [[ -n "$latest_tag" ]]; then
              IFS=. read -r major minor patch <<< "$latest_tag"
              expected="$major.$minor.$((patch + 1))"
              [[ "$version" == "$expected" ]] ||
                fail "Hotfix '$version' must be the next patch after '$latest_tag': expected '$expected'."
            fi
          fi

          echo "Gitflow topology is valid."

      - name: Publish topology result on the PR head
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          [[ "$VALIDATION_OUTCOME" != "success" ]] || state=success
          gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f "state=$state" -f context="Gitflow topology" \
            -f description="Pull-request topology and version rules" \
            -f "target_url=$RUN_URL" >/dev/null

  type-check:
    name: Type Check
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type Check
        run: npm --silent run typecheck

  test:
    name: Test
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm --silent run test:source

  build:
    name: Build
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm --silent run build
