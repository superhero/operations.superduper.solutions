name: cron-outdated
run-name: "Dependency status: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-outdated
  cancel-in-progress: false

jobs:
  branches:
    name: Discover branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.branches.outputs.matrix }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List repository branches
        id: branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches="$(bash .github/scripts/list-dependency-branches.sh "$GITHUB_REPOSITORY")"
          printf 'matrix=%s\n' "$branches" >> "$GITHUB_OUTPUT"

  dependency-status:
    name: Check Dependencies (${{ matrix.branch }})
    needs: branches
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.branches.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false

      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          path: project
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: project/.node-version
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        working-directory: project
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check dependencies and update badge colours
        working-directory: project
        env:
          STATUS_BRANCH: ${{ matrix.branch }}
        run: bash "$GITHUB_WORKSPACE/automation/.github/scripts/update-dependency-status.sh" "$STATUS_BRANCH" .github/badges

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit changed dependency badges
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_BRANCH: ${{ matrix.branch }}
          STATUS_SHA: ${{ matrix.sha }}
        run: bash automation/.github/scripts/publish-dependency-badges.sh "$GITHUB_REPOSITORY" "$STATUS_BRANCH" "$STATUS_SHA" project
