name: Main PR / Push
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Main PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || (github.event_name == 'push' && format('Main push: {0}', github.event.head_commit.message)) || format('Main manual checks: {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  # Validate and build before merging. The push run promotes this bundle without rebuilding.
  topology:
    name: Gitflow topology
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gitflow topology and version rules
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          head="$HEAD_BRANCH"
          base="$BASE_BRANCH"

          fail() {
            echo "::error::$1"
            exit 1
          }

          echo "Validating PR topology: $head -> $base"

          case "$base" in
            main)
              case "$head" in
                release/*|hotfix/*) ;;
                *) fail "Invalid Gitflow topology: only release/* or hotfix/* may merge into main." ;;
              esac
              ;;
            *)
              fail "CI only validates pull requests targeting 'main', got '$base'."
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'

          version=""
          kind=""
          case "$head" in
            release/*)
              kind="release"
              version="${head#release/}"
              ;;
            hotfix/*)
              kind="hotfix"
              version="${head#hotfix/}"
              ;;
          esac

          [[ -n "$version" ]] ||
            fail "Expected release/* or hotfix/* source branch."

          [[ "$version" =~ $semver_re ]] ||
            fail "$kind branch version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            fail "Version tag '$version' already exists."
          fi

          if [[ "$kind" == "release" ]]; then
            mapfile -t active_releases < <(
              git ls-remote --heads origin 'refs/heads/release/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_releases=0
            for branch in "${active_releases[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#release/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_releases=$((other_releases + 1))
            done
            (( other_releases == 0 )) ||
              fail "AVH default permits only one active release/* branch at a time."
          fi

          if [[ "$kind" == "hotfix" ]]; then
            mapfile -t active_hotfixes < <(
              git ls-remote --heads origin 'refs/heads/hotfix/*' |
                awk '{sub("refs/heads/","",$2); print $2}'
            )
            other_hotfixes=0
            for branch in "${active_hotfixes[@]:-}"; do
              [[ -z "$branch" || "$branch" == "$head" ]] && continue
              branch_version="${branch#hotfix/}"
              git rev-parse -q --verify "refs/tags/$branch_version" >/dev/null && continue
              other_hotfixes=$((other_hotfixes + 1))
            done
            (( other_hotfixes == 0 )) ||
              fail "AVH default permits only one active hotfix/* branch at a time."

            git fetch --quiet origin "$base" --tags --force || true

            latest_tag="$(
              git tag --merged "origin/$base" 2>/dev/null |
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1 || true
            )"

            if [[ -n "$latest_tag" ]]; then
              IFS=. read -r major minor patch <<< "$latest_tag"
              expected="$major.$minor.$((patch + 1))"
              [[ "$version" == "$expected" ]] ||
                fail "Hotfix '$version' must be the next patch after '$latest_tag': expected '$expected'."
            fi
          fi

          echo "Gitflow topology is valid."

      - name: Gitflow topology not applicable
        if: github.event_name != 'pull_request'
        run: echo "No pull-request topology to validate for ${{ github.event_name }}."

  installation:
    name: Installation
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

  type-check:
    name: Type Check
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Type Check
        run: npm --silent run typecheck

  source-test:
    name: Source Test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Source Test
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run test:source:coverage 2>&1 | tee tmp/test/source-test-output.txt

      - name: Hand off source test data
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/source-test-output.txt
            tmp/test/coverage/v8
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: source-test
    outputs:
      statements: ${{ steps.coverage.outputs.statements }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore source coverage data
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/source-test-output.txt
            tmp/test/coverage/v8
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Coverage
        id: coverage
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run coverage 2>&1 | tee tmp/test/coverage-output.txt

          value="$(grep -E 'Statements[[:space:]]*:' tmp/test/coverage-output.txt | tail -1 | sed -E 's/.*:[[:space:]]*([0-9]+(\.[0-9]+)?)%.*/\1/')"
          test -n "$value"
          echo "statements=$value" >> "$GITHUB_OUTPUT"

      - name: Hand off coverage report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/coverage
            tmp/test/coverage-output.txt
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

  bundle:
    name: Bundle
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Bundle
        run: npm --silent run build

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error

  test:
    name: Acceptance Test
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist

      - name: Acceptance Test
        run: |
          mkdir -p tmp/test
          set -o pipefail
          npm --silent run test:acceptance 2>&1 | tee tmp/test/test-output.txt

      - name: Hand off test report
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

  test-report:
    name: Test Report
    needs:
      - source-test
      - coverage
      - test
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore source test output
        uses: actions/cache/restore@v6
        with:
          path: tmp/test/source-test-output.txt
          key: source-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore acceptance test report
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/cucumber-test.json
            tmp/test/test-output.txt
          key: test-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test summary
        if: always()
        run: |
          {
            echo '```text'

            if [[ -f tmp/test/source-test-output.txt ]]; then
              sed -E 's/[[:space:]]+# .*:[0-9]+$//' tmp/test/source-test-output.txt
              echo
            else
              echo "No source test output was produced."
              echo
            fi

            if [[ -f tmp/test/test-output.txt ]]; then
              sed -E 's/[[:space:]]+# .*:[0-9]+$//' tmp/test/test-output.txt
            else
              echo "No acceptance test output was produced."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: warn

  coverage-report:
    name: Coverage Report
    needs:
      - coverage
      - test-report
    if: always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Restore coverage report
        uses: actions/cache/restore@v6
        with:
          path: |
            tmp/test/coverage
            tmp/test/coverage-output.txt
          key: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '```text'
            if [[ -f tmp/test/coverage-output.txt ]]; then
              if grep -q "Coverage summary" tmp/test/coverage-output.txt; then
                awk '/Coverage summary/{show=1} show' tmp/test/coverage-output.txt
              else
                cat tmp/test/coverage-output.txt
              fi
            else
              echo "No coverage output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tmp/test/coverage
          if-no-files-found: warn

  # Release work runs only after a push to main; it does not depend on skipped validation jobs.
  context:
    name: Resolve release context
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.release.outputs.applicable }}
      pr_number: ${{ steps.release.outputs.pr_number }}
      head_ref: ${{ steps.release.outputs.head_ref }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}

    steps:
      - name: Resolve merged release or hotfix PR
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr="$(
            gh api "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" |
              jq -c '[
                .[] |
                select(
                  .base.ref == "main" and
                  (
                    (.head.ref | startswith("release/")) or
                    (.head.ref | startswith("hotfix/"))
                  )
                )
              ][0] // empty'
          )"

          if [[ -z "$pr" ]]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "No merged release/* or hotfix/* PR is associated with $MERGE_SHA; post-release work is not applicable."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"

          echo "applicable=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

          echo "Resolved PR #$pr_number ($head_ref @ ${head_sha:0:7}) merged as ${MERGE_SHA:0:7}."

  tag:
    name: Create release tag
    needs: context
    if: needs.context.outputs.applicable == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.merge_sha }}
          fetch-depth: 0

      - name: Create annotated SemVer tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ needs.context.outputs.head_ref }}
          MERGE_SHA: ${{ needs.context.outputs.merge_sha }}
        run: |
          set -euo pipefail

          case "$HEAD_BRANCH" in
            release/*)
              kind="release"
              version="${HEAD_BRANCH#release/}"
              ;;
            hotfix/*)
              kind="hotfix"
              version="${HEAD_BRANCH#hotfix/}"
              ;;
            *)
              echo "::error::Unsupported source branch '$HEAD_BRANCH'."
              exit 1
              ;;
          esac

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$version" =~ $semver_re ]] || {
            echo "::error::$kind version '$version' must be unprefixed SemVer MAJOR.MINOR.PATCH."
            exit 1
          }

          git fetch --quiet --tags --force

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$version^{}")"
            if [[ "$existing" == "$MERGE_SHA" ]]; then
              echo "Tag '$version' already points to this merge commit; nothing to do."
              exit 0
            fi

            echo "::error::Tag '$version' already exists on a different commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$version" "$MERGE_SHA" -m "$kind $version"
          git push origin "refs/tags/$version"

  deploy:
    name: Deploy validated bundle
    needs: context
    if: needs.context.outputs.applicable == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve validated CI run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          HEAD_REF: ${{ needs.context.outputs.head_ref }}
        run: |
          set -euo pipefail

          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow main.yml \
              --event pull_request \
              --commit "$HEAD_SHA" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          [[ -n "$run_id" ]] || {
            echo "::error::No successful release CI run found for PR #$PR_NUMBER at $HEAD_SHA."
            exit 1
          }

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name bundle \
            --dir dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy validated bundle to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.context.outputs.merge_sha }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          set -euo pipefail

          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$MERGE_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
          PR_NUMBER: ${{ needs.context.outputs.pr_number }}
          SOURCE_BRANCH: ${{ needs.context.outputs.head_ref }}
          SOURCE_SHA: ${{ needs.context.outputs.head_sha }}
        run: |
          {
            echo "**Preview URL:** $DEPLOYMENT_URL"
            echo
            echo "**Promoted artifact:** CI run #$SOURCE_RUN_ID"
            echo
            echo "**Source:** PR #$PR_NUMBER ($SOURCE_BRANCH @ ${SOURCE_SHA:0:7})"
          } >> "$GITHUB_STEP_SUMMARY"

  backmerge:
    name: Back-merge main into develop
    needs: context
    if: needs.context.outputs.applicable == 'true'
    concurrency:
      group: post-release-backmerge
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Synchronize main into develop without a CI gate
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          develop_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/develop" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$develop_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the branch commits."
            exit 1
          }

          behind_by="$(gh api "repos/$REPOSITORY/compare/$main_sha...$develop_sha" --jq '.behind_by')"
          [[ "$behind_by" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not determine whether synchronization is needed."
            exit 1
          }
          if [[ "$behind_by" == "0" ]]; then
            echo "develop already contains main; no synchronization is needed."
            exit 0
          fi

          # Use the workflow token, not the App token: no automatic PR CI or push CI.
          pr_number="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open -f base=develop -f "head=${REPOSITORY%%/*}:main" \
              --jq '.[0].number // empty'
          )"
          if [[ -z "$pr_number" ]]; then
            pr_number="$(
              gh api --method POST "repos/$REPOSITORY/pulls" \
                -f base=develop -f head=main \
                -f title="Back-merge main into develop" \
                -f body="Automatic Gitflow synchronization. Development checks run after the merge and do not gate synchronization." \
                --jq '.number'
            )"
          fi
          [[ "$pr_number" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not resolve the synchronization PR."
            exit 1
          }

          # Satisfy only the actual topology rule, never manufacture test results.
          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          jq -e --arg repo "$REPOSITORY" --arg sha "$main_sha" '
            .state == "open" and .draft == false and
            .base.ref == "develop" and .head.ref == "main" and
            .base.repo.full_name == $repo and .head.repo.full_name == $repo and
            .head.sha == $sha
          ' <<<"$pr" >/dev/null || {
            echo "::error::PR topology or main head changed; refusing to merge."
            exit 1
          }

          gh api --method POST "repos/$REPOSITORY/statuses/$main_sha" \
            -f state=success -f context="Gitflow topology" \
            -f description="Validated same-repository main -> develop synchronization" \
            -f "target_url=$RUN_URL" >/dev/null

          # GitHub still enforces branch rules and rejects conflicts or a changed head.
          result="$(
            gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" \
              -f merge_method=merge -f "sha=$main_sha"
          )"
          jq -e '.merged == true' <<<"$result" >/dev/null || {
            echo "::error::GitHub did not merge the synchronization PR."
            exit 1
          }
          merge_sha="$(jq -r '.sha' <<<"$result")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::GitHub returned an invalid merge commit."
            exit 1
          }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Start development health checks after synchronization
        id: health
        if: steps.sync.outputs.merged == 'true'
        continue-on-error: true
        shell: bash
        env:
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
        run: |
          set -euo pipefail
          # Explicit dispatch is needed because GITHUB_TOKEN suppresses push workflows.
          # Check the resulting develop commit, not the pre-merge main commit.
          jq -n --arg sha "$MERGE_SHA" '{ref: "develop", inputs: {commit_sha: $sha}}' |
            gh api --method POST "repos/$REPOSITORY/actions/workflows/develop.yml/dispatches" --input -

      - name: Synchronization summary
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          MERGED: ${{ steps.sync.outputs.merged }}
          PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          MERGE_SHA: ${{ steps.sync.outputs.merge_sha }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          if [[ "$MERGED" == "true" ]]; then
            echo "Merged main into develop through PR #$PR_NUMBER at $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$HEALTH_OUTCOME" == "success" ]]; then
              echo "Development health checks requested after the merge; their result does not gate synchronization." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Synchronization succeeded, but development health checks could not be started."
              echo "Development health checks could not be started; synchronization remains complete." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$SYNC_OUTCOME" == "success" ]]; then
            echo "develop already contains main; no back-merge was needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Synchronization did not complete; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
