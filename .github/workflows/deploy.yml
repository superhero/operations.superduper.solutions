name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read

jobs:
  deploy:
    name: Deploy validated bundle
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve merged pull request and validated CI run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/commits/$MERGE_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0]'
          )"

          pr_number="$(jq -r '.number // empty' <<<"$pr")"
          head_sha="$(jq -r '.head.sha // empty' <<<"$pr")"
          head_ref="$(jq -r '.head.ref // empty' <<<"$pr")"

          [[ -n "$pr_number" && -n "$head_sha" ]] || {
            echo "::error::Could not resolve the merged pull request for main commit $MERGE_SHA."
            exit 1
          }

          case "$head_ref" in
            release/*|hotfix/*) ;;
            *)
              echo "::error::Main commit came from unsupported source branch '$head_ref'."
              exit 1
              ;;
          esac

          run_id="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow ci.yml \
              --event pull_request \
              --commit "$head_sha" \
              --status success \
              --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq '.[0].databaseId // empty'
          )"

          [[ -n "$run_id" ]] || {
            echo "::error::No successful release CI run found for PR #$pr_number at $head_sha."
            exit 1
          }

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name bundle \
            --dir dist

      - name: Check deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare deployment credentials are not configured in GitHub Actions."
          exit 1

      - name: Deploy validated bundle to Cloudflare Pages
        id: cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions

      - name: Record GitHub deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PAGES_DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id }}
          PAGES_ENVIRONMENT: ${{ steps.cloudflare.outputs.pages-environment }}
        run: |
          set -euo pipefail

          environment="${PAGES_ENVIRONMENT:-production}"

          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              --arg environment "$environment" \
              '{
                ref: $ref,
                auto_merge: false,
                required_contexts: [],
                environment: $environment,
                production_environment: true,
                description: "Cloudflare Pages"
              }' |
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments" \
              --input - \
              --jq '.id'
          )"

          jq -n \
            --arg environment "$environment" \
            --arg environment_url "$DEPLOYMENT_URL" \
            --arg log_url "https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/pages/view/operations-superduper-solutions/${PAGES_DEPLOYMENT_ID}" \
            '{
              state: "success",
              environment: $environment,
              environment_url: $environment_url,
              log_url: $log_url,
              description: "Cloudflare Pages",
              auto_inactive: false
            }' |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
            --input - \
            >/dev/null

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          PR_NUMBER: ${{ steps.release.outputs.pr_number }}
          SOURCE_BRANCH: ${{ steps.release.outputs.head_ref }}
          SOURCE_SHA: ${{ steps.release.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          {
            echo "**Preview URL:** $DEPLOYMENT_URL"
            echo
            echo "**Promoted artifact:** CI run #$SOURCE_RUN_ID"
            echo
            echo "**Source:** PR #$PR_NUMBER ($SOURCE_BRANCH @ ${SOURCE_SHA:0:7})"
          } >> "$GITHUB_STEP_SUMMARY"
