name: ci-release
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [ 'release/**' ]
    types: [ opened, synchronize, reopened, edited, ready_for_review ]

concurrency:
  group: integration-ci
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Prepare queued integration
    if: "!startsWith(github.head_ref, 'docs/')"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/prepare-integration.yml
    with:
      mode: merge
      workflow-file: .github/workflows/ci-release.yml
    secrets:
      app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  validation:
    needs: integration
    name: Find Previous Validation

    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.find.outputs.reused }}
      source_run_id: ${{ steps.find.outputs.source_run_id }}
      source_run_attempt: ${{ steps.find.outputs.source_run_attempt }}
      source_sha: ${{ steps.find.outputs.source_sha }}
      tested_sha: ${{ steps.find.outputs.tested_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Find complete matching validation
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.integration.outputs.tested_sha }}
        run: node .github/scripts/find-validation.mjs "$REPOSITORY" "$TARGET_SHA" tmp/reused-validation
      - name: Retain verified artifacts for this run
        if: steps.find.outputs.reused == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reused-validation
          path: tmp/reused-validation
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  workflow-checks:
    name: Automation Checks
    needs: [ integration, validation ]
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: needs.validation.outputs.reused != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false
      - name: Lint standalone scripts
        if: needs.validation.outputs.reused != 'true'
        run: shellcheck .github/scripts/*.sh
      - name: Set up Node.js
        if: needs.validation.outputs.reused != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Check dependency version badges
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run badges:dependencies -- --check
      - name: Test automation
        if: needs.validation.outputs.reused != 'true'
        id: automation
        run: npm --loglevel=error run test:automation
      - name: Upload automation report
        if: ${{ !cancelled() && (steps.automation.outcome == 'success' || steps.automation.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-report
          path: |-
            tmp/test/vitest-automation.json
            tmp/test/blobs/automation.json
            tmp/test/executions/automation.json
            tmp/test/attachments
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Reuse successful automation validation
        if: needs.validation.outputs.reused == 'true'
        env:
          SOURCE_RUN_ID: ${{ needs.validation.outputs.source_run_id }}
        run: echo "Automation already passed in validated run $SOURCE_RUN_ID."

  validate-pr:
    needs: integration
    name: Validate Gitflow
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr.sh "$REPOSITORY" "$HEAD_BRANCH" "$BASE_BRANCH" "$HEAD_SHA"
  validation-prepare:
    name: Prepare validation and quick gates
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
    if: (needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')) &&
      (needs.validation.outputs.reused != 'true' && vars.CI_INCREMENTAL_TESTS != 'false')
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Type check
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run typecheck
      - name: Source tests with coverage
        if: needs.validation.outputs.reused != 'true'
        id: source
        run: npm --loglevel=error run test:source:coverage
      - name: Gherkin runner integration contracts
        id: runner
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run test:runner
      - name: Check coverage thresholds
        if: needs.validation.outputs.reused != 'true'
        id: coverage
        run: >
          npm --loglevel=error run test:coverage

          jq -r '.total | "Coverage: statements \(.statements.pct)%, branches \(.branches.pct)%, functions
          \(.functions.pct)%, lines \(.lines.pct)%."' \
            tmp/test/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        if: needs.validation.outputs.reused != 'true'
        run: npm --loglevel=error run build
      - name: Acceptance tests
        if: needs.validation.outputs.reused != 'true'
        id: acceptance
        run: npm --loglevel=error run test:acceptance
      - name: Component tests
        id: components
        env:
          OPERATIONS_BROWSER_PROFILE: components
        run: npm --loglevel=error run test:browser
      - name: Prepare immutable browser inputs
        env:
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/ci-prepare.mjs
      - name: Verify reusable feature evidence before scheduling
        id: cache
        uses: ./.github/actions/ci-browser
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: prepare
          node: node
      - name: Upload prepared browser inputs
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-inputs
          path: |-
            dist
            tmp/test/ci/plan.json
            tmp/test/browser/fixture-bundles.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Retain quick-profile evidence
        if: "!cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure')"
        uses: actions/upload-artifact@v7
        with:
          name: ci-node-test-report
          path: |-
            tmp/test/vitest-*.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
            tmp/test/coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Retain verified reused units
        if: steps.cache.outputs.has_reused == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-reused-units
          path: tmp/test/units
          if-no-files-found: error
          overwrite: true
          retention-days: 7
    outputs:
      matrix: ${{ steps.cache.outputs.matrix }}
      has_work: ${{ steps.cache.outputs.has_work }}
      has_reused: ${{ steps.cache.outputs.has_reused }}
  browser-validation:
    name: Browser validation (${{ matrix.batch }})
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
      - validation-prepare
    if: ((needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/')) &&
      (needs.validation.outputs.reused != 'true' && vars.CI_INCREMENTAL_TESTS != 'false')) &&
      needs.validation-prepare.outputs.has_work == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validation-prepare.outputs.matrix || '{"batch":["none"]}') }}
    steps:
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Locate pinned Node
        id: node
        run: printf 'path=%s\n' "$(readlink -f "$(command -v node)")" >> "$GITHUB_OUTPUT"
      - name: Download prepared browser inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-browser-inputs --dir .
      - name: Run outstanding features and publish checkpoints
        uses: ./.github/actions/ci-browser
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_FILE: .github/workflows/ci-release.yml
        with:
          mode: batch
          batch: ${{ matrix.batch }}
          node: ${{ steps.node.outputs.path }}
      - name: Retain browser batch metrics
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: ci-browser-metrics-${{ matrix.batch }}-attempt-${{ github.run_attempt }}
          path: tmp/test/ci/batch-*.json
          if-no-files-found: warn
          retention-days: 7

  application:
    name: Test and Build
    needs:
      - integration
      - validate-pr
      - workflow-checks
      - validation
      - validation-prepare
      - browser-validation
    if: (!cancelled()) && (needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Require successful preparation and quick gates
        env:
          STATIC_RESULT: ${{ needs.workflow-checks.result }}
          PREPARE_RESULT: ${{ needs.validation-prepare.result }}
          VALIDATION_REUSED: ${{ needs.validation.outputs.reused }}
          GATE_VALIDATE_PR: ${{ needs.validate-pr.result }}
          GATE_VALIDATION: ${{ needs.validation.result }}
        run: >-
          [[ "$GATE_VALIDATE_PR" == success ]] || { echo "::error::Required validate-pr gate failed or was skipped.";
          exit 1; }

          [[ "$GATE_VALIDATION" == success ]] || { echo "::error::Required validation gate failed or was skipped."; exit
          1; }

          [[ "$STATIC_RESULT" == success ]] || { echo "::error::Quick checks failed."; exit 1; }

          if [[ "$CI_INCREMENTAL_TESTS" == true && "$VALIDATION_REUSED" != true ]]; then
            [[ "$PREPARE_RESULT" == success ]] || { echo "::error::Validation preparation failed or was skipped."; exit 1; }
          fi
      - name: Checkout validation inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore verified validation artifacts
        if: needs.validation.outputs.reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.validation.outputs.source_run_id }}
        run: >
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name reused-validation --dir tmp/validation

          printf 'Reusing complete validation and unchanged artifacts from run %s. Reports retain their original commit
          and run URL.\n' "$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        if: needs.validation.outputs.reused != 'true'
        run: npm ci --no-audit --no-fund
      - name: Restore prepared application and profile evidence
        id: prepared
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-browser-inputs --dir .
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-node-test-report --dir tmp/test
      - name: Restore previously verified units
        if: env.CI_INCREMENTAL_TESTS == 'true' && needs.validation.outputs.reused != 'true' &&
          needs.validation-prepare.outputs.has_reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ci-reused-units --dir tmp/test/units
      - name: Type check
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run typecheck
      - name: Source tests with coverage
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: source
        run: npm --loglevel=error run test:source:coverage
      - name: Gherkin runner integration contracts
        id: runner
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run test:runner
      - name: Check coverage thresholds
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: coverage
        run: >
          npm --loglevel=error run test:coverage

          jq -r '.total | "Coverage: statements \(.statements.pct)%, branches \(.branches.pct)%, functions
          \(.functions.pct)%, lines \(.lines.pct)%."' \
            tmp/test/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        run: npm --loglevel=error run build
      - name: Acceptance tests
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS != 'true')
        id: acceptance
        run: npm --loglevel=error run test:acceptance
      - name: Browser tests against the built bundle
        if: needs.validation.outputs.reused != 'true'
        id: browser
        timeout-minutes: 70
        run: |-
          if [[ "$CI_INCREMENTAL_TESTS" == true ]]; then
            node .github/scripts/ci-restore-browser.mjs
            node tests/gherkin/ci.mjs assemble
          else
            npm --loglevel=error run test:browser
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require successful browser batches
        if: (needs.validation.outputs.reused != 'true') && (env.CI_INCREMENTAL_TESTS == 'true')
        env:
          BROWSER_BATCH_RESULT: ${{ needs.browser-validation.result }}
          HAS_WORK: ${{ needs.validation-prepare.outputs.has_work }}
        run: >-
          if [[ "$HAS_WORK" == true ]]; then
            [[ "$BROWSER_BATCH_RESULT" == success ]] || { echo "::error::Browser batch execution or checkpoint publication failed."; exit 1; }
          else
            [[ "$BROWSER_BATCH_RESULT" == skipped ]] || { echo "::error::Unexpected browser execution state."; exit 1; }
          fi
      - name: Upload browser results and diagnostics
        if: ${{ !cancelled() && (steps.browser.outcome == 'success' || steps.browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |-
            tmp/test/vitest-browser-chromium.json
            tmp/test/vitest-components.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
            tmp/test/browser
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload application test results
        if: ${{ !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: application-test-report
          path: |-
            tmp/test/vitest-source.json
            tmp/test/vitest-acceptance.json
            tmp/test/vitest-runner.json
            tmp/test/vitest-browser-chromium.json
            tmp/test/vitest-components.json
            tmp/test/blobs
            tmp/test/executions
            tmp/test/attachments
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Download automation test results
        if: ${{ !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name automation-test-report --dir tmp/test
      - name: Generate combined test report
        if: needs.validation.outputs.reused != 'true'
        id: report
        env:
          REPORT_COMMIT: ${{ needs.integration.outputs.tested_sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm --loglevel=error run report:tests
      - name: Generate diagnostic report after failure
        id: failure-report
        if: failure() && !cancelled() && (steps.source.outcome == 'success' || steps.source.outcome == 'failure' ||
          steps.prepared.outcome == 'success')
        env:
          REPORT_COMMIT: ${{ needs.integration.outputs.tested_sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          warning='CI failed. This diagnostic report does not certify a successful build.'
          REPORT_WARNING="$warning" node .github/scripts/generate-test-report.mjs tmp/test/report tmp/test/blobs
      - name: Upload failed validation diagnostics
        if: failure() && steps.failure-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: validation-diagnostics
          path: |-
            tmp/test/report
            tmp/test/coverage
            !tmp/test/coverage/v8
          if-no-files-found: error
          retention-days: 7
      - name: Generate report badges
        if: needs.validation.outputs.reused != 'true'
        run: |
          npm --loglevel=error run badges:coverage
          npm --loglevel=error run badges:scenarios
      - name: Bind complete validation to its inputs and artifacts
        if: needs.validation.outputs.reused != 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ needs.integration.outputs.tested_sha }}
        run: >
          mkdir -p tmp/validation/bundle tmp/validation/coverage tmp/validation/test-report

          cp -a dist/. tmp/validation/bundle/

          cp -a tmp/test/coverage/. tmp/validation/coverage/

          rm -rf tmp/validation/coverage/v8

          cp -a tmp/test/report/. tmp/validation/test-report/

          cp -a tmp/test/badges tmp/validation/test-report/

          # Empty generated folders have no upload payload; retain every file for strict verification.

          find tmp/validation/bundle tmp/validation/coverage tmp/validation/test-report \
            -mindepth 1 -depth -type d -empty -delete
          node .github/scripts/validation-artifacts.mjs create "$REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          "$PR_HEAD_SHA" "$TESTED_SHA" tmp/validation/bundle tmp/validation/coverage
          tmp/validation/test-report/index.html tmp/validation/validation-manifest.json
      - name: Upload tested bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: tmp/validation/bundle
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tmp/validation/coverage
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload combined test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/validation/test-report
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload original validation proof
        if: needs.validation.outputs.reused != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-manifest
          path: tmp/validation/validation-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  auto-merge:
    name: Auto Merge
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [ integration, workflow-checks, validate-pr, application ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout validated merge
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false
      - name: Merge validated pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ needs.integration.outputs.base_sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA" "$HEAD_BRANCH"

  preview:
    name: Deploy Preview
    needs: [ integration, auto-merge ]
    if: >-
      needs.integration.outputs.ready == 'true' && !startsWith(github.head_ref, 'docs/') &&
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    concurrency:
      group: pages-${{ github.base_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAGES_BRANCH: ${{ github.base_ref }}
      DEPLOY_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout tested automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify merged content matches tested bundle
        env:
          TESTED_SHA: ${{ needs.integration.outputs.tested_sha }}
        run: bash .github/scripts/validate-release-tree.sh "$TESTED_SHA" "$DEPLOY_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download tested bundle
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --name bundle --dir dist || {
            echo "::error::Cannot download tested bundle from $REPOSITORY run $GITHUB_RUN_ID (branch=$PAGES_BRANCH, commit=$DEPLOY_SHA, destination=dist)." >&2
            exit 1
          }
      - name: Check preview content and destination
        id: prepare
        run: bash .github/scripts/prepare-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" dist
      - name: Create GitHub App token
        if: steps.prepare.outputs.skipped == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write
      - name: Deploy changed preview
        if: steps.prepare.outputs.deploy == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch="${{ env.PAGES_BRANCH }}"
            --commit-hash=${{ env.DEPLOY_SHA }} --commit-dirty=false --commit-message=bundle-sha256:${{
            steps.prepare.outputs.bundle_hash }}
      - name: Verify and record preview deployment
        if: (success() || (failure() && steps.cloudflare.outcome == 'failure')) && steps.prepare.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_HASH: ${{ steps.prepare.outputs.bundle_hash }}
          DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id || steps.prepare.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare.outcome == 'failure' && 'failure' || 'success' }}
        run: bash .github/scripts/record-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" "$BUNDLE_HASH"
          "$DEPLOYMENT_ID" "$DEPLOYMENT_OUTCOME"
env:
  CI_INCREMENTAL_TESTS: ${{ vars.CI_INCREMENTAL_TESTS != 'false' && 'true' || 'false' }}
  CI_BROWSER_CAPTURE: ${{ vars.CI_BROWSER_CAPTURE || 'minimal' }}
