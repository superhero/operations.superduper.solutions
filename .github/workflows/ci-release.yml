name: ci-release
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-branch-direction:
    name: Validate Branch Direction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validating
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          bash .github/scripts/validate-branch-direction.sh \
            "$HEAD_BRANCH" \
            "$BASE_BRANCH" \
            'release/*' \
            'hotfix/*'

  validate-hotfix:
    name: Validate Hotfix
    if: startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.head_ref }}
      BASE_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validating
        shell: bash
        run: |
          version="${HEAD_BRANCH#hotfix/}"

          bash .github/scripts/validate-semver.sh "$version"
          bash .github/scripts/validate-tag-available.sh "$REPOSITORY" "$version"
          bash .github/scripts/validate-single-active-branch.sh "$REPOSITORY" hotfix "$HEAD_BRANCH"
          bash .github/scripts/validate-next-patch.sh "$REPOSITORY" "$BASE_BRANCH" "$version"

  auto-merge:
    name: Auto Merge
    needs:
      - validate-branch-direction
      - validate-hotfix
    if: >-
      ${{
        always()
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft
        && needs.validate-branch-direction.result == 'success'
        && (needs.validate-hotfix.result == 'success' || needs.validate-hotfix.result == 'skipped')
      }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Auto Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"
