name: ci-release
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: ['release/**']
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  # Keep post-merge publication running when a PR is edited.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Automation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint standalone scripts
        run: shellcheck .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check dependency version badges
        run: npm --loglevel=error run badges:dependencies -- --check

      - name: Test automation
        id: automation
        run: npm --loglevel=error run test:automation

      - name: Upload automation report
        if: success() || (failure() && steps.automation.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-report
          path: tmp/test/cucumber-automation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  validate-pr:
    name: Validate Gitflow
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr.sh "$REPOSITORY" "$HEAD_BRANCH" "$BASE_BRANCH" "$HEAD_SHA"

  application:
    name: Test and Build
    needs: validate-pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm --loglevel=error run typecheck

      - name: Source tests
        run: npm --loglevel=error run test:source

      - name: Build
        run: npm --loglevel=error run build

      - name: Acceptance tests
        id: acceptance
        run: npm --loglevel=error run test:acceptance

      - name: Upload tested bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload failed acceptance report
        if: failure() && steps.acceptance.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: tmp/test/cucumber-test.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  auto-merge:
    name: Auto Merge
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [workflow-checks, validate-pr, application]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout validated merge
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Merge validated pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA" "$HEAD_BRANCH"

  preview:
    name: Deploy Preview
    needs: auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    concurrency:
      group: pages-${{ github.base_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAGES_BRANCH: ${{ github.base_ref }}
      DEPLOY_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout tested automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged content matches tested bundle
        env:
          TESTED_SHA: ${{ github.sha }}
        run: bash .github/scripts/validate-release-tree.sh "$TESTED_SHA" "$DEPLOY_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download tested bundle
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --name bundle --dir dist || {
            echo "::error::Cannot download tested bundle from $REPOSITORY run $GITHUB_RUN_ID (branch=$PAGES_BRANCH, commit=$DEPLOY_SHA, destination=dist)." >&2
            exit 1
          }

      - name: Check preview content and destination
        id: prepare
        run: bash .github/scripts/prepare-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" dist

      - name: Create GitHub App token
        if: steps.prepare.outputs.skipped == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write

      - name: Deploy changed preview
        if: steps.prepare.outputs.deploy == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch="${{ env.PAGES_BRANCH }}" --commit-hash=${{ env.DEPLOY_SHA }} --commit-dirty=false --commit-message=bundle-sha256:${{ steps.prepare.outputs.bundle_hash }}

      - name: Verify and record preview deployment
        if: >-
          (success() || (failure() && steps.cloudflare.outcome == 'failure'))
          && steps.prepare.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_HASH: ${{ steps.prepare.outputs.bundle_hash }}
          DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id || steps.prepare.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare.outcome == 'failure' && 'failure' || 'success' }}
        run: bash .github/scripts/record-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" "$BUNDLE_HASH" "$DEPLOYMENT_ID" "$DEPLOYMENT_OUTCOME"
