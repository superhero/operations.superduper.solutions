name: dependency-status

on:
  push:
    branches:
      - main
      - develop
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-status.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: status-json-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Dependency Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate dependency status
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm outdated --json > "$RUNNER_TEMP/outdated.json"
          status=$?
          set -e

          (( status <= 1 )) || exit "$status"
          [[ -s "$RUNNER_TEMP/outdated.json" ]] || echo '{}' > "$RUNNER_TEMP/outdated.json"

          count="$(jq 'length' "$RUNNER_TEMP/outdated.json")"

          if [[ "$count" == "0" ]]; then
            message="up to date"
            color="brightgreen"
          else
            message="$count outdated"
            color="orange"
          fi

          mkdir -p tmp/status

          jq -n \
            --arg message "$message" \
            --arg color "$color" \
            '{
              schemaVersion: 1,
              label: "Dependencies",
              message: $message,
              color: $color
            }' > tmp/status/version-dependencies.json

          while IFS= read -r package; do
            current="$(jq -r --arg package "$package" '.devDependencies[$package]' package.json)"
            latest="$(npm view "$package" version)"
            label="$package"
            slug="$(printf '%s' "${package#@}" | sed 's|/|--|g')"

            if [[ "$current" == "$latest" ]]; then
              package_color="blue"
            else
              package_color="orange"
            fi

            jq -n \
              --arg label "$label" \
              --arg current "$current" \
              --arg color "$package_color" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $current,
                color: $color
              }' > "tmp/status/version-dependency-$slug.json"
          done < <(jq -r '.devDependencies | keys[]' package.json)


      - name: Publish dependency status to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            echo "::error::Cloudflare R2 credentials are not configured in GitHub Actions." >&2
            exit 1
          }

          case "$GITHUB_REF_NAME" in
            main) prefix="" ;;
            develop) prefix="develop/" ;;
            *)
              echo "::error::Unsupported status branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          while IFS= read -r -d '' file; do
            key="${file#tmp/status/}"
            object_key="${prefix}${key}"

            if ! response="$(
              curl --fail-with-body --silent --show-error \
                --request PUT \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data-binary @"$file" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/operations-status/objects/$object_key"
            )"; then
              echo "::error::Failed to publish R2 object: $object_key" >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi

            if ! jq -e '.success == true' <<<"$response" >/dev/null; then
              echo "::error::Cloudflare returned an unsuccessful response for R2 object: $object_key" >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi
          done < <(find tmp/status -type f -name '*.json' -print0)

          legacy_keys=("dependencies.json")
          while IFS= read -r package; do
            slug="$(printf '%s' "${package#@}" | sed 's|/|--|g')"
            legacy_keys+=("dependencies/$slug.json")
          done < <(jq -r '.devDependencies | keys[]' package.json)

          for legacy_key in "${legacy_keys[@]}"; do
            if ! response="$(
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/operations-status/objects/${prefix}${legacy_key}"
            )"; then
              echo "::error::Failed to delete legacy R2 object: ${prefix}${legacy_key}" >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi

            if ! jq -e '.success == true' <<<"$response" >/dev/null; then
              echo "::error::Cloudflare returned an unsuccessful response while deleting legacy R2 object: ${prefix}${legacy_key}" >&2
              printf '%s\n' "$response" >&2
              exit 1
            fi
          done
