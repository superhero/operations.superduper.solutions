name: dependency-status

on:
  push:
    branches:
      - develop
      - feature/dev-dependencies-only
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-status.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update Dependency Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate dependency status
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm outdated --json > "$RUNNER_TEMP/outdated.json"
          status=$?
          set -e

          (( status <= 1 )) || exit "$status"
          [[ -s "$RUNNER_TEMP/outdated.json" ]] || echo '{}' > "$RUNNER_TEMP/outdated.json"

          count="$(jq 'length' "$RUNNER_TEMP/outdated.json")"

          if [[ "$count" == "0" ]]; then
            message="up to date"
            color="brightgreen"
          else
            message="$count outdated"
            color="orange"
          fi

          mkdir -p tmp/badges/dependencies

          jq -n \
            --arg message "$message" \
            --arg color "$color" \
            '{
              schemaVersion: 1,
              label: "Dependencies",
              message: $message,
              color: $color
            }' > tmp/badges/dependencies.json

          while IFS= read -r package; do
            current="$(jq -r --arg package "$package" '.devDependencies[$package]' package.json)"
            latest="$(npm view "$package" version)"
            label="${package#@}"
            slug="$(printf '%s' "$label" | sed 's|/|--|g')"

            if [[ "$current" == "$latest" ]]; then
              package_color="blue"
            else
              package_color="orange"
            fi

            jq -n \
              --arg label "$label" \
              --arg current "$current" \
              --arg color "$package_color" \
              '{
                schemaVersion: 1,
                label: $label,
                message: $current,
                color: $color
              }' > "tmp/badges/dependencies/$slug.json"
          done < <(jq -r '.devDependencies | keys[]' package.json)

      - name: Publish dependency status
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tmp/badges --project-name=operations-superduper-badges --branch=develop
