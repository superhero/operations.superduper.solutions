name: dependency-status

on:
  push:
    branches:
      - main
      - develop
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-status.yml
      - .github/scripts/generate-dependency-status.sh
      - .github/scripts/publish-status.sh
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: status-json-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Dependency Status
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate dependency status
        shell: bash
        run: |
          status=0
          npm outdated --json > "$RUNNER_TEMP/outdated.json" || status=$?
          if (( status > 1 )); then
            echo "::error::npm outdated --json failed (exit $status; repository=${GITHUB_REPOSITORY:-local}, branch=${GITHUB_REF_NAME:-unknown}, manifest=package.json, output=$RUNNER_TEMP/outdated.json); dependency badges were not generated." >&2
            jq -r '.error? | select(type == "object") |
              "npm error \(.code | if type == "string" then . else "unknown" end): \(.summary | if type == "string" then . else "No summary provided" end)" |
              gsub("[\\r\\n]+"; " ")' "$RUNNER_TEMP/outdated.json" >&2 2>/dev/null || true
            exit "$status"
          fi
          if [[ "$status" == 0 && ! -s "$RUNNER_TEMP/outdated.json" ]]; then
            echo '{}' > "$RUNNER_TEMP/outdated.json"
          fi
          bash .github/scripts/generate-dependency-status.sh \
            package.json "$RUNNER_TEMP/outdated.json" tmp/status

      - name: Publish dependency status to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$GITHUB_REF_NAME" in
            main) prefix="" ;;
            develop) prefix="develop/" ;;
            *)
              echo "::error::Unsupported status branch: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          for file in tmp/status/*.json; do
            bash .github/scripts/publish-status.sh \
              "$file" "${prefix}${file##*/}" application/json
          done
