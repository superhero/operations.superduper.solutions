name: dependency-status

on:
  push:
    branches:
      - develop
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-status.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update Dependency Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate dependency status
        shell: bash
        run: |
          set -euo pipefail

          set +e
          npm outdated --json > "$RUNNER_TEMP/outdated.json"
          status=$?
          set -e

          (( status <= 1 )) || exit "$status"
          [[ -s "$RUNNER_TEMP/outdated.json" ]] || echo '{}' > "$RUNNER_TEMP/outdated.json"

          count="$(jq 'length' "$RUNNER_TEMP/outdated.json")"

          if [[ "$count" == "0" ]]; then
            message="up to date"
            color="brightgreen"
          else
            message="$count outdated"
            color="orange"
          fi

          jq -n \
            --arg message "$message" \
            --arg color "$color" \
            '{
              schemaVersion: 1,
              label: "Dependencies",
              message: $message,
              color: $color
            }' > "$RUNNER_TEMP/dependencies.json"

      - name: Publish dependency status
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin badges:refs/remotes/origin/badges; then
            git switch --detach origin/badges
          else
            git switch --orphan badges
            git rm -rf .
          fi

          cp "$RUNNER_TEMP/dependencies.json" dependencies.json
          git add dependencies.json

          git diff --cached --quiet && exit 0

          git commit -m "Update dependency status"
          git push origin HEAD:badges
