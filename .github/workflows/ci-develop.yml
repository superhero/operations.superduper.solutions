name: ci-develop
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: integration-ci
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Prepare queued integration
    if: "!startsWith(github.head_ref, 'docs/')"
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/prepare-integration.yml
    with:
      mode: merge
      workflow-file: .github/workflows/ci-develop.yml
    secrets:
      app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

  workflow-checks:
    name: Static Checks
    needs: integration
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false

      - name: Lint standalone scripts
        run: shellcheck .github/scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check dependency version badges
        run: npm --loglevel=error run badges:dependencies -- --check

  validate-pr:
    needs: integration
    name: Validate Gitflow
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false

      - name: Validate pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validate-pr.sh "$REPOSITORY" "$HEAD_BRANCH" "$BASE_BRANCH" "$HEAD_SHA"

  prepare-changelog:
    name: Prepare Latest Changelog
    if: "needs.integration.outputs.ready == 'true' && (!startsWith(github.head_ref, 'docs/'))"
    needs: [integration, workflow-checks, validate-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      updated: ${{ steps.prepare.outputs.updated }}
    env:
      PREPARE_LATEST: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
            && !github.event.pull_request.draft
            && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bugfix/')) }}
    steps:
      - name: Checkout trusted base automation
        if: env.PREPARE_LATEST == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select changelog automation and fetch pinned objects
        if: env.PREPARE_LATEST == 'true'
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ needs.integration.outputs.tested_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$authorization"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            git fetch --no-tags origin "$HEAD_SHA" "$TESTED_SHA"
          scripts="$GITHUB_WORKSPACE/.github/scripts"
          if [[ ! -f "$scripts/prepare-changelog.sh" || ! -f "$scripts/prepare-changelog.mjs" || ! -f "$scripts/changelog.mjs" ]] || ! grep -q 'LATEST_TRAILER' "$scripts/changelog.mjs"; then
            # First rollout: these exact proposed-merge files have already
            # passed static workflow checks under the same-repository trust model.
            scripts="$(mktemp -d "$RUNNER_TEMP/changelog-automation.XXXXXX")"
            for file in prepare-changelog.sh prepare-changelog.mjs changelog.mjs; do
              git show "$TESTED_SHA:.github/scripts/$file" > "$scripts/$file"
            done
          fi
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: env.PREPARE_LATEST == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Prepare source changelog before preview build
        if: env.PREPARE_LATEST == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ needs.integration.outputs.base_sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          SCRIPTS: ${{ steps.automation.outputs.scripts }}
        run: bash "$SCRIPTS/prepare-changelog.sh" "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA" "$HEAD_BRANCH"

  application:
    name: Build Preview
    needs: [integration, validate-pr, prepare-changelog, workflow-checks]
    if: >-
      needs.integration.outputs.ready == 'true'
      && !startsWith(github.head_ref, 'docs/')
      && needs.prepare-changelog.outputs.updated != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout prepared merge
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm --loglevel=error run typecheck

      - name: Build
        run: npm --loglevel=error run build

      - name: Upload preview bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

  auto-merge:
    name: Auto Merge
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    concurrency:
      group: merge-${{ github.base_ref }}
      cancel-in-progress: false
    needs: [integration, workflow-checks, validate-pr, application]
    if: >-
      needs.integration.outputs.ready == 'true'
      && !startsWith(github.head_ref, 'docs/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout prepared merge
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          persist-credentials: false

      - name: Merge prepared pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ needs.integration.outputs.base_sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$BASE_BRANCH" "$BASE_SHA" "$HEAD_BRANCH"

  preview:
    name: Deploy Preview
    needs: [integration, auto-merge]
    if: >-
      needs.integration.outputs.ready == 'true'
      && !startsWith(github.head_ref, 'docs/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    concurrency:
      group: pages-${{ github.base_ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PAGES_BRANCH: ${{ github.base_ref }}
      DEPLOY_SHA: ${{ needs.auto-merge.outputs.merge_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
    steps:
      - name: Checkout prepared automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.integration.outputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged content matches preview bundle
        env:
          TESTED_SHA: ${{ needs.integration.outputs.tested_sha }}
        run: bash .github/scripts/validate-release-tree.sh "$TESTED_SHA" "$DEPLOY_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Download preview bundle
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" --name bundle --dir dist || {
            echo "::error::Cannot download preview bundle from $REPOSITORY run $GITHUB_RUN_ID (branch=$PAGES_BRANCH, commit=$DEPLOY_SHA, destination=dist)." >&2
            exit 1
          }

      - name: Check preview content and destination
        id: prepare
        run: bash .github/scripts/prepare-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" dist

      - name: Create GitHub App token
        if: steps.prepare.outputs.skipped == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-deployments: write

      - name: Deploy changed preview
        if: steps.prepare.outputs.deploy == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=operations-superduper-solutions --branch="${{ env.PAGES_BRANCH }}" --commit-hash=${{ env.DEPLOY_SHA }} --commit-dirty=false --commit-message=bundle-sha256:${{ steps.prepare.outputs.bundle_hash }}

      - name: Verify and record preview deployment
        if: >-
          (success() || (failure() && steps.cloudflare.outcome == 'failure'))
          && steps.prepare.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_HASH: ${{ steps.prepare.outputs.bundle_hash }}
          DEPLOYMENT_ID: ${{ steps.cloudflare.outputs.pages-deployment-id || steps.prepare.outputs.deployment_id }}
          DEPLOYMENT_OUTCOME: ${{ steps.cloudflare.outcome == 'failure' && 'failure' || 'success' }}
        run: bash .github/scripts/record-pages-deployment.sh "$REPOSITORY" "$PAGES_BRANCH" "$DEPLOY_SHA" "$BUNDLE_HASH" "$DEPLOYMENT_ID" "$DEPLOYMENT_OUTCOME"
