name: ci-develop
run-name: "#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  # Validate proposed development changes before merging, not on the resulting push.
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

concurrency:
  group: development-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-checks:
    name: Workflow Checks
    uses: ./.github/workflows/workflow-checks.yml

  validate-branch-direction:
    name: Validate Branch Direction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validating
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          bash .github/scripts/validate-branch-direction.sh \
            "$HEAD_BRANCH" \
            "$BASE_BRANCH" \
            develop \
            'feature/*' \
            'bugfix/*' \
            'release/*' \
            'hotfix/*' \
            main

  validate-release:
    name: Validate Release
    if: startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validating
        shell: bash
        run: |
          version="${HEAD_BRANCH#release/}"

          bash .github/scripts/validate-semver.sh "$version"
          bash .github/scripts/validate-tag-available.sh "$REPOSITORY" "$version"
          bash .github/scripts/validate-single-active-branch.sh "$REPOSITORY" release "$HEAD_BRANCH"

  validate-hotfix:
    name: Validate Hotfix
    if: startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.head_ref }}
      BASE_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validating
        shell: bash
        run: |
          version="${HEAD_BRANCH#hotfix/}"

          bash .github/scripts/validate-semver.sh "$version"
          bash .github/scripts/validate-tag-available.sh "$REPOSITORY" "$version"
          bash .github/scripts/validate-single-active-branch.sh "$REPOSITORY" hotfix "$HEAD_BRANCH"
          bash .github/scripts/validate-next-patch.sh "$REPOSITORY" "$BASE_BRANCH" "$version"

  installation:
    name: Installation
    outputs:
      cache_key: ${{ steps.handoff.outputs.cache_key }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record handoff cache key
        id: handoff
        run: echo "cache_key=dependencies-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Hand off dependencies
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.handoff.outputs.cache_key }}

  type-check:
    name: Type Check
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: node_modules
          key: ${{ needs.installation.outputs.cache_key }}

      - name: Type Check
        run: npm --silent run typecheck

  test:
    name: Test
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: node_modules
          key: ${{ needs.installation.outputs.cache_key }}

      - name: Test
        run: npm --silent run test:source

  build:
    name: Build
    needs: installation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Restore dependencies
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: node_modules
          key: ${{ needs.installation.outputs.cache_key }}

      - name: Build
        run: npm --silent run build

  auto-merge:
    name: Auto Merge
    needs:
      - workflow-checks
      - validate-branch-direction
      - validate-release
      - validate-hotfix
      - installation
      - type-check
      - test
      - build
    if: >-
      ${{
        always()
        && github.event.pull_request.head.repo.full_name == github.repository
        && !github.event.pull_request.draft
        && needs.validate-branch-direction.result == 'success'
        && (needs.validate-release.result == 'success' || needs.validate-release.result == 'skipped')
        && (needs.validate-hotfix.result == 'success' || needs.validate-hotfix.result == 'skipped')
        && needs.workflow-checks.result == 'success'
        && needs.installation.result == 'success'
        && needs.type-check.result == 'success'
        && needs.test.result == 'success'
        && needs.build.result == 'success'
      }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Auto Merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/auto-merge.sh "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA"
