  <script>
    // Apply the cached appearance before the first paint; IndexedDB replaces it at startup.
    try {
      const cached = JSON.parse(localStorage.getItem("v1/settings/appearance-cache") || "null");
      if (cached?.version === 1 && (cached.theme === "light" || cached.theme === "dark")
        && typeof cached.palette === "string" && /^[a-z][a-z0-9-]{0,63}$/.test(cached.palette)) {
        document.documentElement.dataset.theme = cached.theme;
        document.documentElement.dataset.palette = cached.palette;
        document.documentElement.classList.toggle("dark", cached.theme === "dark");
      }
    } catch { /* Continue with the default appearance when the cache is unavailable. */ }
  </script>
